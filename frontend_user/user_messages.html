<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — Message Center</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#fcf9f2",
            "on-background": "#1c1c18",
            "primary": "#9f402d",
            "primary-container": "#e2725b",
            "surface-lowest": "#ffffff",
            "surface-variant": "#f1eee7",
            "outline": "#ddc0ba"
          },
          fontFamily: { "body": ["Manrope"] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Manrope', sans-serif; background: #fcf9f2; min-height: 100vh; overflow-x: hidden; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    
    .message-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .message-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(159, 64, 45, 0.05);
    }
  </style>
</head>

<body class="text-on-background pb-32">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#fcf9f2]/90 backdrop-blur-xl border-b border-outline/30 px-6 py-5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-90 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary font-bold">arrow_back</span>
      </button>
      <h1 class="font-black text-primary text-2xl tracking-tight">Notifications</h1>
    </div>
    <span class="material-symbols-outlined text-primary text-3xl fill-icon">chat_bubble</span>
  </header>

  <!-- Main Messages Feed -->
  <main class="max-w-2xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <h2 id="messages-count-heading" class="text-sm font-black uppercase tracking-widest text-[#89726d]">Updates Feed</h2>
      <button onclick="markAllAsRead()" class="text-xs font-bold text-primary hover:underline flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">done_all</span> Mark all read
      </button>
    </div>

    <!-- Container where real notification items load -->
    <div id="messages-container" class="space-y-4">
      <div class="text-center py-12 text-[#89726d] italic">
        Synchronizing notification trails...
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Menu Bar -->
  <nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 pb-8 pt-4 bg-[#fcf9f2]/95 backdrop-blur-2xl shadow-[0_-10px_40px_rgba(28,28,24,0.06)] font-manrope text-[11px] font-semibold tracking-wide uppercase border-t border-outline/20">
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-6 py-2 hover:opacity-100 transition-all active:scale-90" href="dashboard.html">
      <span class="material-symbols-outlined text-xl mb-0.5">home</span><span>Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-6 py-2 hover:opacity-100 transition-all active:scale-90" href="services.html">
      <span class="material-symbols-outlined text-xl mb-0.5">grid_view</span><span>Services</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-6 py-2 hover:opacity-100 transition-all active:scale-90" href="booking_history.html">
      <span class="material-symbols-outlined text-xl mb-0.5">event_note</span><span>Bookings</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-6 py-2 hover:opacity-100 transition-all active:scale-90" href="profile.html">
      <span class="material-symbols-outlined text-xl mb-0.5">person</span><span>Profile</span>
    </a>
  </nav>

  <script>
    const API = 'http://localhost:8000/api';
    let localNotificationsList = [];

    // Fetch account bookings to derive real-time status change notices
    async function fetchUserNotifications() {
      const sessionKey = localStorage.getItem('session_key');
      if (!sessionKey) { window.location.href = 'login.html'; return; }

      try {
        // 1. Fetch current profile context to ensure authentic parsing boundaries
        const profileRes = await fetch(`${API}/profile/`, { headers: { 'X-Session-Key': sessionKey } });
        const profileData = await profileRes.json();
        if (profileData.status !== 'success') return;
        const currentUserId = profileData.data.id;

        // 2. Query booking references matrix
        const bookingsRes = await fetch(`${API}/bookings/`, { headers: { 'X-Session-Key': sessionKey } });
        const bookingsData = await bookingsRes.json();
        
        if (bookingsData.status === 'success' && bookingsData.data) {
          // Filter tasks strictly linked to this specific user profile
          const targetBookings = bookingsData.data.filter(b => b.client == currentUserId || b.client_id == currentUserId);
          
          // Generate customized clean updates array
          localNotificationsList = [];
          
          targetBookings.forEach(b => {
            // Build notices dynamically matching status pathways
            let updateTitle = "Booking Update";
            let updateContent = `Your order setup line regarding worker assignment has shifted states.`;
            let iconCode = "notifications";
            let iconColorClass = "text-amber-600 bg-amber-50";

            if (b.status === 'pending') {
              updateTitle = "Request Dispatched";
              updateContent = `Your request has been delivered safely to ${b.worker_name || 'the worker'}. Waiting for availability response.`;
              iconCode = "hourglass_top";
              iconColorClass = "text-orange-600 bg-orange-50";
            } else if (b.status === 'accepted') {
              updateTitle = "Assignment Confirmed";
              updateContent = `Great news! ${b.worker_name || 'The worker'} accepted your appointment block line. They will reach out shortly.`;
              iconCode = "check_circle";
              iconColorClass = "text-purple-600 bg-purple-50";
            } else if (b.status === 'in_progress') {
              updateTitle = "Job In Progress";
              updateContent = `${b.worker_name || 'The worker'} has officially clocked in and started tasks at your location.`;
              iconCode = "handshake";
              iconColorClass = "text-blue-600 bg-blue-50";
            } else if (b.status === 'completed') {
              updateTitle = "Task Completed";
              updateContent = `Job closed successfully by ${b.worker_name || 'the worker'}. Final calculations generated. Remember to provide service evaluation feedback!`;
              iconCode = "task_alt";
              iconColorClass = "text-green-600 bg-green-50";
            } else if (b.status === 'cancelled' || b.status === 'rejected') {
              updateTitle = "Request Cancelled";
              updateContent = `The assignment parameters linked to ID #${b.id} have terminated or been declined.`;
              iconCode = "cancel";
              iconColorClass = "text-red-600 bg-red-50";
            }

            localNotificationsList.push({
              id: b.id,
              title: updateTitle,
              desc: updateContent,
              icon: iconCode,
              color: iconColorClass,
              isRead: false, // Locally defaults to dynamic simulation framework
              type: b.status
            });
          });

          renderNotifications(localNotificationsList.reverse());
        }
      } catch (error) {
        console.error("Error building notification loop:", error);
        document.getElementById('messages-container').innerHTML = `
          <p class="text-center text-red-500 font-bold py-8">An entry error prevented message trail loading.</p>`;
      }
    }

    function renderNotifications(items) {
      const container = document.getElementById('messages-container');
      const headingCount = document.getElementById('messages-count-heading');
      
      if (items.length === 0) {
        headingCount.textContent = "Updates Feed (0)";
        container.innerHTML = `
          <div class="bg-surface-lowest p-12 rounded-3xl text-center border border-outline/20 shadow-sm mt-4">
            <span class="material-symbols-outlined text-outline/60 text-6xl mb-3" style="font-variation-settings: 'FILL' 1;">notifications_off</span>
            <h3 class="font-extrabold text-xl mb-1 text-on-background">Inbox Completely Clear</h3>
            <p class="text-sm text-[#89726d]">There are no activity updates or transaction notes recorded currently.</p>
          </div>`;
        return;
      }

      headingCount.textContent = `Updates Feed (${items.length})`;

      container.innerHTML = items.map(item => {
        const dotBadge = !item.isRead 
          ? `<span class="h-2.5 w-2.5 rounded-full bg-primary block shrink-0 mt-1.5" title="Unread Notice"></span>` 
          : '';

        return `
          <div id="notice-card-${item.id}" class="message-card bg-surface-lowest rounded-3xl p-5 border border-outline/20 shadow-[0_4px_20px_rgba(28,28,24,0.02)] flex gap-4 items-start">
            <div class="w-12 h-12 rounded-2xl ${item.color} flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-symbols-outlined text-xl fill-icon">${item.icon}</span>
            </div>
            
            <div class="flex-1 space-y-1">
              <div class="flex justify-between items-start">
                <h4 class="font-black text-on-background text-base leading-tight">${item.title}</h4>
                <span class="text-[10px] font-bold text-[#89726d] bg-surface-variant px-2 py-0.5 rounded-md uppercase tracking-wider">ID #${item.id}</span>
              </div>
              <p class="text-sm text-[#56423e] leading-relaxed font-medium">${item.desc}</p>
            </div>
            
            ${dotBadge}
          </div>
        `;
      }).join('');
    }

    function markAllAsRead() {
      // Toggle readability values cleanly for microinteractions visualization
      localNotificationsList.forEach(item => item.isRead = true);
      renderNotifications(localNotificationsList);
      
      // Remove visual marker flags instantly from view layers
      const matchingDots = document.querySelectorAll('.message-card span.bg-primary');
      matchingDots.forEach(dot => dot.remove());
    }

    document.addEventListener("DOMContentLoaded", fetchUserNotifications);
  </script>
</body>

</html>
