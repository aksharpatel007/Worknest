<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — Message Center</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#fcf9f2",
            "on-background": "#1c1c18",
            "primary": "#9f402d",
            "primary-container": "#e2725b",
            "surface-lowest": "#ffffff",
            "surface-variant": "#f1eee7",
            "outline": "#ddc0ba"
          },
          fontFamily: { "body": ["Manrope"] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Manrope', sans-serif; background: #fcf9f2; min-height: 100vh; overflow-x: hidden; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    
    .message-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .message-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(159, 64, 45, 0.05);
    }
  </style>
</head>

<body class="text-on-background pb-32">

  <!-- Responsive Header Frame -->
  <header class="sticky top-0 z-50 bg-[#fcf9f2]/90 backdrop-blur-xl border-b border-outline/30 px-4 sm:px-6 py-4 sm:py-5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-90 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary font-bold text-xl sm:text-2xl">arrow_back</span>
      </button>
      <!-- Text size scales adaptively on mobile vs laptop viewports -->
      <h1 class="font-black text-primary text-xl sm:text-2xl md:text-3xl tracking-tight">Notifications</h1>
    </div>
    <span class="material-symbols-outlined text-primary text-2xl sm:text-3xl fill-icon">chat_bubble</span>
  </header>

  <!-- Responsive Content Grid Structure -->
  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="flex items-center justify-between mb-6">
      <h2 id="messages-count-heading" class="text-xs sm:text-sm font-black uppercase tracking-widest text-[#89726d]">Updates Feed</h2>
      <button onclick="markAllAsRead()" class="text-[11px] sm:text-xs font-bold text-primary hover:underline flex items-center gap-1">
        <span class="material-symbols-outlined text-xs sm:text-sm">done_all</span> Mark all read
      </button>
    </div>

    <!-- Container where real notification items load -->
    <div id="messages-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-12 text-[#89726d] text-xs sm:text-sm italic animate-pulse">
        Synchronizing notification trails...
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Menu Bar -->
   <nav class="fixed bottom-2 left-4 right-4 z-40 flex justify-around items-center px-2 sm:px-4 py-2 bg-[#fcf9f2]/90 backdrop-blur-2xl shadow-[0_10px_40px_rgba(28,28,24,0.06)] text-[10px] sm:text-[11px] font-semibold tracking-wide uppercase border border-outline-variant/30 rounded-2xl max-w-sm mx-auto">
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-4 sm:px-6 py-1.5 sm:py-2 hover:opacity-100 transition-all active:scale-90" href="dashboard.html">
      <span class="material-symbols-outlined text-lg sm:text-xl mb-0.5">home</span><span>Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-4 sm:px-6 py-1.5 sm:py-2 hover:opacity-100 transition-all active:scale-90" href="services.html">
      <span class="material-symbols-outlined text-lg sm:text-xl mb-0.5">grid_view</span><span>Services</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-4 sm:px-6 py-1.5 sm:py-2 hover:opacity-100 transition-all active:scale-90" href="booking_history.html">
      <span class="material-symbols-outlined text-lg sm:text-xl mb-0.5">event_note</span><span>Bookings</span>
    </a>
    <a class="flex flex-col items-center justify-center text-[#56642b] opacity-50 px-4 sm:px-6 py-1.5 sm:py-2 hover:opacity-100 transition-all active:scale-90" href="profile.html">
      <span class="material-symbols-outlined text-lg sm:text-xl mb-0.5">person</span><span>Profile</span>
    </a>
  </nav>

  <script>
    const API = 'http://localhost:8000/api';
    let localNotificationsList = [];

    async function fetchUserNotifications() {
      const sessionKey = localStorage.getItem('session_key');
      if (!sessionKey) { window.location.href = 'login.html'; return; }

      try {
        const profileRes = await fetch(`${API}/profile/`, { headers: { 'X-Session-Key': sessionKey } });
        const profileData = await profileRes.json();
        if (profileData.status !== 'success') return;
        const currentUserId = profileData.data.id;

        const bookingsRes = await fetch(`${API}/bookings/`, { headers: { 'X-Session-Key': sessionKey } });
        const bookingsData = await bookingsRes.json();
        
        if (bookingsData.status === 'success' && bookingsData.data) {
          const targetBookings = bookingsData.data.filter(b => b.client == currentUserId || b.client_id == currentUserId);
          
          localNotificationsList = [];
          
          targetBookings.forEach(b => {
            let updateTitle = "Booking Update";
            let updateContent = `Your order setup line regarding worker assignment has shifted states.`;
            let iconCode = "notifications";
            let iconColorClass = "text-amber-600 bg-amber-50";

            if (b.status === 'pending') {
              updateTitle = "Request Dispatched";
              updateContent = `Your request has been delivered safely to ${b.worker_name || 'the worker'}. Waiting for availability response.`;
              iconCode = "hourglass_top";
              iconColorClass = "text-orange-600 bg-orange-50";
            } else if (b.status === 'accepted') {
              updateTitle = "Assignment Confirmed";
              updateContent = `Great news! ${b.worker_name || 'The worker'} accepted your appointment block line. They will reach out shortly.`;
              iconCode = "check_circle";
              iconColorClass = "text-purple-600 bg-purple-50";
            } else if (b.status === 'in_progress') {
              updateTitle = "Job In Progress";
              updateContent = `${b.worker_name || 'The worker'} has officially clocked in and started tasks at your location.`;
              iconCode = "handshake";
              iconColorClass = "text-blue-600 bg-blue-50";
            } else if (b.status === 'completed') {
              updateTitle = "Task Completed";
              updateContent = `Job closed successfully by ${b.worker_name || 'the worker'}. Final calculations generated. Remember to provide service evaluation feedback!`;
              iconCode = "task_alt";
              iconColorClass = "text-green-600 bg-green-50";
            } else if (b.status === 'cancelled' || b.status === 'rejected') {
              updateTitle = "Request Cancelled";
              updateContent = `The assignment parameters linked to ID #${b.id} have terminated or been declined.`;
              iconCode = "cancel";
              iconColorClass = "text-red-600 bg-red-50";
            }

            // Capture raw date variables safely across lifecycle metrics
            const rawTimestamp = b.completed_at || b.started_at || new Date().toISOString();

            localNotificationsList.push({
              id: b.id,
              title: updateTitle,
              desc: updateContent,
              icon: iconCode,
              color: iconColorClass,
              isRead: false,
              type: b.status,
              rawDate: rawTimestamp // Saved directly for explicit sorting operations
            });
          });

          // 🎯 CRITICAL SORTING FIX: Organizes items using timestamp properties to guarantee the absolute newest items appear first
          localNotificationsList.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));

          renderNotifications(localNotificationsList);
        }
      } catch (error) {
        console.error("Error building notification loop:", error);
        document.getElementById('messages-container').innerHTML = `
          <p class="text-sm font-bold text-center text-red-500 py-8 col-span-full">An entry error prevented message trail loading.</p>`;
      }
    }

    function renderNotifications(items) {
      const container = document.getElementById('messages-container');
      const headingCount = document.getElementById('messages-count-heading');
      
      if (items.length === 0) {
        headingCount.textContent = "Updates Feed (0)";
        container.innerHTML = `
          <div class="col-span-full bg-surface-lowest p-8 sm:p-12 rounded-3xl text-center border border-outline/20 shadow-sm mt-4">
            <span class="material-symbols-outlined text-outline/60 text-5xl sm:text-6xl mb-3" style="font-variation-settings: 'FILL' 1;">notifications_off</span>
            <h3 class="font-extrabold text-lg sm:text-xl mb-1 text-on-background">Inbox Completely Clear</h3>
            <p class="text-xs sm:text-sm text-[#89726d]">There are no activity updates or transaction notes recorded currently.</p>
          </div>`;
        return;
      }

      headingCount.textContent = `Updates Feed (${items.length})`;

      container.innerHTML = items.map(item => {
        const dotBadge = !item.isRead 
          ? `<span class="h-2 w-2 rounded-full bg-primary block shrink-0 mt-1.5" title="Unread Notice"></span>` 
          : '';

        // Generate precise formatted local date and 12-hour time arrays cleanly
        const msgTime = new Date(item.rawDate);
        const dateStr = msgTime.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const timeStr = msgTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        return `
          <div id="notice-card-${item.id}" class="message-card bg-surface-lowest rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-outline/20 shadow-[0_4px_20px_rgba(28,28,24,0.02)] flex gap-3 sm:gap-4 items-start">
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl ${item.color} flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-symbols-outlined text-lg sm:text-xl fill-icon">${item.icon}</span>
            </div>
            
            <div class="flex-1 min-w-0 space-y-1">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                <!-- Headline text scales flexibly across viewports -->
                <h4 class="font-black text-on-background text-sm sm:text-base leading-tight truncate">${item.title}</h4>
                <!-- Responsive date-time alignment text block -->
                <span class="text-[10px] sm:text-xs font-semibold text-[#89726d] shrink-0">${dateStr} • ${timeStr}</span>
              </div>
              <p class="text-xs sm:text-sm text-[#56423e] leading-relaxed font-medium">${item.desc}</p>
            </div>
            
            ${dotBadge}
          </div>
        `;
      }).join('');
    }

    function markAllAsRead() {
      localNotificationsList.forEach(item => item.isRead = true);
      renderNotifications(localNotificationsList);
      
      const matchingDots = document.querySelectorAll('.message-card span.bg-primary');
      matchingDots.forEach(dot => dot.remove());
    }

    document.addEventListener("DOMContentLoaded", fetchUserNotifications);
  </script>
</body>

</html>
