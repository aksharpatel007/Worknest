<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Notifications — Worknest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Manrope', sans-serif; background: #fcf9f2; }</style>
</head>
<body class="min-h-screen text-[#1c1c18] pb-10">

<header class="sticky top-0 z-40 bg-[#fcf9f2]/90 backdrop-blur-md border-b border-[#ddc0ba]/20 px-6 py-4 flex items-center gap-3">
  <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-full hover:bg-[#f1eee7]">
    <span class="material-symbols-outlined text-[#9f402d]">arrow_back</span>
  </button>
  <h1 class="font-black text-[#9f402d] text-xl">Notification Center</h1>
</header>

<main class="max-w-xl mx-auto px-6 py-6 space-y-4" id="inbox-container">
  <p class="text-center text-sm text-[#89726d] py-10">Loading messages stream...</p>
</main>

<script>
async function loadInbox() {
  const sessionKey = localStorage.getItem('session_key');
  try {
    const res = await fetch('http://localhost:8000/api/notifications/', {
      headers: { 'X-Session-Key': sessionKey }
    });
    const data = await res.json();
    const box = document.getElementById('inbox-container');
    
    if (data.status !== 'success' || !data.data.length) {
      box.innerHTML = `<div class='text-center py-10'><span class='material-symbols-outlined text-4xl text-[#ddc0ba]'>mail_lock</span><p class='text-sm font-bold text-[#89726d] mt-2'>Your message inbox is currently empty.</p></div>`;
      return;
    }
    
    box.innerHTML = data.data.map(n => `
      <div class="bg-white border border-[#ddc0ba]/30 shadow-sm rounded-2xl p-5 space-y-2">
        <div class="flex justify-between items-start">
          <h3 class="font-black text-[#1c1c18] text-md leading-tight">${n.title}</h3>
          <span class="text-[10px] font-bold text-[#89726d] shrink-0 bg-[#f1eee7] px-2 py-0.5 rounded-md">${n.formatted_date}</span>
        </div>
        <p class="text-sm font-medium text-[#56423e] whitespace-pre-line leading-relaxed">${n.message}</p>
      </div>`).join('');
  } catch(e) { }
}
loadInbox();
</script>
</body>
</html>
