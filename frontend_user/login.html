<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght=200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#cec7a2",
                        "on-surface": "#1c1c19",
                        "surface-tint": "#9f402d",
                        "on-secondary-fixed-variant": "#4b472b",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#56423e",
                        "secondary-fixed": "#eae3bc",
                        "on-primary-container": "#5a0d02",
                        "surface-container-low": "#f6f3ee",
                        "outline-variant": "#ddc0ba",
                        "inverse-on-surface": "#f3f0eb",
                        "tertiary-fixed-dim": "#5cdbc2",
                        "surface-bright": "#fcf9f4",
                        "on-tertiary-fixed": "#00201a",
                        "on-secondary-container": "#686344",
                        "inverse-surface": "#31302d",
                        "secondary-container": "#e8e0ba",
                        "on-background": "#1c1c19",
                        "tertiary-container": "#00a58e",
                        "on-tertiary-fixed-variant": "#005144",
                        "primary-fixed-dim": "#ffb4a5",
                        "primary": "#9f402d",
                        "surface-container": "#f0ede8",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf9f4",
                        "on-primary-fixed-variant": "#802918",
                        "surface-dim": "#dcdad5",
                        "tertiary-fixed": "#7bf8dd",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#1f1c04",
                        "on-primary": "#ffffff",
                        "outline": "#89726d",
                        "on-tertiary-container": "#00322a",
                        "secondary": "#635f40",
                        "surface-container-high": "#ebe8e3",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e5e2dd",
                        "primary-container": "#e2725b",
                        "on-primary-fixed": "#3e0500",
                        "inverse-primary": "#ffb4a5",
                        "surface": "#fcf9f4",
                        "primary-fixed": "#ffdad3",
                        "surface-container-highest": "#e5e2dd",
                        "tertiary": "#006b5b",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Manrope", sans-serif;
            background-color: #fcf9f4;
            background-image: radial-gradient(circle at 20% 80%, rgba(214, 231, 161, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 218, 211, 0.4) 0%, transparent 50%);
            min-height: max(884px, 100dvh);
        }

        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
        }

        .pebble-shadow {
            box-shadow: 0 20px 40px rgba(159, 64, 45, 0.06)
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-input {
            animation: shake 0.4s ease-in-out;
            border: 1.5px solid #ba1a1a !important;
        }
    </style>
</head>

<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
    
    <div id="toast-notification" class="fixed top-6 left-1/2 transform -translate-x-1/2 translate-y-[-100px] opacity-0 transition-all duration-500 max-w-sm w-full px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 z-50 pointer-events-none border border-white/10" style="background-color: #31302d;">
        <span class="material-symbols-outlined" style="color: #ffb4a5;">error</span>
        <span id="toast-text" class="text-sm font-bold tracking-wide flex-1" style="color: #ffb4a5;">Error message here</span>
    </div>

    <main class="w-full max-w-md flex flex-col gap-12">
        <header class="flex flex-col items-center text-center gap-4">
            <div class="w-20 h-20 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center pebble-shadow mb-4">
                <span class="material-symbols-outlined text-white text-4xl" data-icon="potted_plant">potted_plant</span>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter text-on-surface">Worknest</h1>
            <p class="text-secondary max-w-[280px] leading-relaxed">Welcome back! Sign in to find workers or manage your bookings.</p>
        </header>

        <section class="flex flex-col gap-6" id="login-section">
            <form id="login-form" class="flex flex-col gap-6" novalidate>
                
                <div class="flex items-center gap-3 p-2 bg-surface-container rounded-full pebble-shadow">
                    <span class="material-symbols-outlined text-secondary ml-4" data-icon="email">email</span>
                    <div class="flex-1 py-1 px-2">
                        <input type="email" name="email" id="email" required placeholder="Email Address"
                            class="w-full bg-transparent border-none focus:ring-0 text-xl tracking-widest text-on-surface-variant font-medium outline-none">
                    </div>
                </div>
                
                <div id="password-wrapper" class="flex items-center gap-3 p-2 bg-surface-container rounded-full pebble-shadow relative border border-transparent transition-all duration-300">
                    <span class="material-symbols-outlined text-secondary ml-4" data-icon="lock">lock</span>
                    
                    <div class="flex-1 py-1 pl-2 pr-12">
                        <input type="password" name="password" id="login-password-field" required placeholder="Password"
                            class="w-full bg-transparent border-none focus:ring-0 text-xl tracking-widest text-on-surface-variant font-medium outline-none">
                    </div>

                    <button type="button" onclick="toggleLoginPassword()" class="absolute right-5 text-secondary hover:text-[#E07A5F] focus:outline-none flex items-center justify-center">
                        <span class="material-symbols-outlined" id="login-eye-icon">visibility_off</span>
                    </button>
                </div>

                <div class="text-right pr-4 -mt-2">
                    <a href="{% url 'forgot_password_page' %}" class="text-sm font-bold text-primary underline hover:text-primary-container">Forgot Password?</a>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-white rounded-full font-bold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-300">
                    Sign In Securely
                </button>
            </form>
            
            <div class="text-center text-sm font-medium">
                <p class="text-on-surface-variant">New around here?</p>
                <div class="flex justify-center gap-4 mt-2">
                    <a href="{% url 'signup_page' %}" class="text-primary underline hover:text-primary-container font-bold">Sign up as User</a>
                    <a href="{% url 'worker_signup_page' %}" class="text-tertiary underline hover:text-tertiary-container font-bold">Apply as Worker</a>
                </div>
            </div>
        </section>

        <footer class="mt-8 flex flex-col items-center gap-6">
            <div class="flex items-center gap-2 px-4 py-2 bg-tertiary/10 text-tertiary rounded-full">
                <span class="material-symbols-outlined text-sm" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                <span class="text-[11px] font-bold uppercase tracking-widest">Worknest Secure Login</span>
            </div>
        </footer>
    </main>

    <div class="fixed -top-20 -left-20 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl -z-10"></div>
    <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>

    <script>
        function toggleLoginPassword() {
            const passwordField = document.getElementById('login-password-field');
            const eyeIcon = document.getElementById('login-eye-icon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                passwordField.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3500);
        }

        function triggerPasswordShake() {
            const wrapper = document.getElementById('password-wrapper');
            wrapper.classList.add('shake-input');
            setTimeout(() => { wrapper.classList.remove('shake-input'); }, 400);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const formData = new FormData(e.target);
            const email = formData.get('email').trim();
            const password = formData.get('password');

            if (!email || !password) {
                triggerPasswordShake();
                showToast("Please fill in all fields!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Signing In...";

            try {
                const payload = { email: email, password: password };
                const res = await fetch('/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status === 'success') {
                    if (data.session_key) {
                        localStorage.setItem('session_key', data.session_key);
                    }
                    // Clear so welcome toast fires fresh on every login
                    sessionStorage.removeItem('welcome_shown');
                    if (data.redirect.includes('worker_dashboard') || data.redirect.includes('/worker/dashboard/')) {
                        window.location.href = window.location.origin + '/worker/dashboard/';
                    } else {
                        let path = data.redirect;
                        if (!path.startsWith('/')) path = '/' + path;
                        if (path.endsWith('.html')) path = path.slice(0, -5) + '/';
                        window.location.href = window.location.origin + path;
                    }
                } else {
                    triggerPasswordShake();
                    showToast(data.message || "Invalid login credentials.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign In Securely";
                }
            } catch (err) {
                showToast("Cannot connect to server. Make sure Django is running.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In Securely";
            }
        });

        async function checkAutoRedirect() {
            const sessionKey = localStorage.getItem('session_key');
            if (sessionKey) {
                try {
                    const res = await fetch('/api/profile/', {
                        headers: { 'X-Session-Key': sessionKey },
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.status === 'success' && data.data) {
                        const user = data.data;
                        if (user.role_id === 1) {
                            window.location.href = '/admin-dashboard/';
                        } else if (user.role_id === 2) {
                            window.location.href = '/worker/dashboard/';
                        } else if (user.role_id === 3) {
                            window.location.href = '/dashboard/';
                        }
                    }
                } catch (e) {
                    console.error("Auto-redirect check failed:", e);
                }
            }
        }
        document.addEventListener("DOMContentLoaded", checkAutoRedirect);
    </script>
</body>
</html>
