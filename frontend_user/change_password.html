<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Worknest — Change Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght=200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ba1a1a",
              "on-surface": "#1c1c19",
              "primary": "#9f402d",
              "surface-container": "#f0ede8",
              "primary-container": "#e2725b",
              "inverse-surface": "#31302d",
              "secondary": "#635f40"
            },
            fontFamily: { "body": ["Manrope"] }
          },
        },
      }
    </script>
    <style>
        body {
            font-family: "Manrope", sans-serif;
            background-color: #fcf9f4;
            background-image: radial-gradient(circle at 20% 80%, rgba(214,231,161,0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,218,211,0.4) 0%, transparent 50%);
            min-height: 100dvh;
        }
        .pebble-shadow { box-shadow: 0 20px 40px rgba(159, 64, 45, 0.06); }
        
        /* 🎯 iPhone જેવી ધ્રૂજવા (Shake) માટેની એનિમેશન સીએસએસ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-input { animation: shake 0.4s ease-in-out; border: 1.5px solid #ba1a1a !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 relative">

    <div class="absolute top-6 left-6 z-50">
        <button onclick="window.history.back()" class="flex items-center justify-center w-12 h-12 bg-white text-primary rounded-full shadow-md hover:bg-orange-50 hover:scale-105 active:scale-95 transition-all duration-300 border border-surface-container">
            <span class="material-symbols-outlined font-bold">arrow_back</span>
        </button>
    </div>

    <!-- Error Toast (red) -->
    <div id="toast-notification" class="fixed top-6 left-1/2 transform -translate-x-1/2 translate-y-[-100px] opacity-0 transition-all duration-500 max-w-sm w-full px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 z-50 pointer-events-none border border-white/10" style="background-color: #31302d;">
        <span class="material-symbols-outlined" style="color: #ffb4a5;">error</span>
        <span id="toast-text" class="text-sm font-bold tracking-wide flex-1" style="color: #ffb4a5;">Error message here</span>
    </div>

    <!-- Success Popup (green) -->
    <div id="success-popup" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:2rem; padding:2.5rem 2rem; max-width:340px; width:90%; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.2); animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);">
            <div style="width:72px;height:72px;background:linear-gradient(180deg,#fcf9f4,#9f402d);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
                <span class="material-symbols-outlined" style="color:white;font-size:2.2rem;font-variation-settings:'FILL' 1;">check_circle</span>
            </div>
            <h3 style="font-size:1.3rem;font-weight:800;color:#1c1c19;margin-bottom:0.5rem;">Password Updated!</h3>
            <p id="success-popup-msg" style="color:#635f40;font-size:0.9rem;margin-bottom:1.5rem;">Your password has been changed successfully.</p>
            <button onclick="closeSuccessAndRedirect()" style="background:linear-gradient(180deg,#df573b,#9f402d);color:white;border:none;padding:0.85rem 2.5rem;border-radius:9999px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;">OK</button>
        </div>
    </div>
    <style>
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>

    <main class="w-full max-w-md flex flex-col gap-8">
        <header class="flex flex-col items-center text-center gap-2">
            <div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center pebble-shadow mb-2">
                <span class="material-symbols-outlined text-white text-3xl">lock_reset</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tighter text-on-surface">Update Password</h1>
            <p class="text-secondary text-sm">Keep your Worknest account secure by setting a strong password.</p>
        </header>

        <section class="flex flex-col gap-6 bg-white/40 p-6 rounded-3xl pebble-shadow backdrop-blur-sm">
            <form id="change-password-form" class="flex flex-col gap-5" novalidate>
                
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-secondary ml-3">Current Password</label>
                    <div class="flex items-center gap-3 p-2 bg-surface-container rounded-full relative">
                        <span class="material-symbols-outlined text-secondary ml-4">lock</span>
                        <input type="password" id="current-password" required placeholder="••••••••" class="w-full bg-transparent border-none focus:ring-0 text-lg text-on-surface outline-none">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-secondary ml-3">New Password</label>
                    <div id="password-wrapper" class="flex items-center gap-3 p-2 bg-surface-container rounded-full relative border border-transparent transition-all duration-300">
                        <span class="material-symbols-outlined text-secondary ml-4">lock_open</span>
                        <div class="flex-1 pr-12">
                            <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-transparent border-none focus:ring-0 text-lg text-on-surface outline-none">
                        </div>
                        <button type="button" onclick="togglePassword('new-password', 'eye-icon-1')" class="absolute right-5 text-secondary flex items-center">
                            <span class="material-symbols-outlined" id="eye-icon-1">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-secondary ml-3">Confirm New Password</label>
                    <div class="flex items-center gap-3 p-2 bg-surface-container rounded-full relative">
                        <span class="material-symbols-outlined text-secondary ml-4">done_all</span>
                        <div class="flex-1 pr-12">
                            <input type="password" id="confirm-password" required placeholder="••••••••" class="w-full bg-transparent border-none focus:ring-0 text-lg text-on-surface outline-none">
                        </div>
                        <button type="button" onclick="togglePassword('confirm-password', 'eye-icon-2')" class="absolute right-5 text-secondary flex items-center">
                            <span class="material-symbols-outlined" id="eye-icon-2">visibility_off</span>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 mt-2 bg-gradient-to-br from-primary to-primary-container text-white rounded-full font-bold text-md shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-300">
                    Save Changes
                </button>
            </form>
            
            <div class="text-center text-sm font-medium">
                 <button onclick="window.history.back()" class="text-primary underline font-bold">Cancel and Go Back</button>
            </div>
        </section>
    </main>

    <script>
        function showSuccessPopup(msg) {
            document.getElementById('success-popup-msg').textContent = msg;
            const popup = document.getElementById('success-popup');
            popup.style.display = 'flex';
        }

        function closeSuccessAndRedirect() {
            document.getElementById('success-popup').style.display = 'none';
            window.history.back();
        }

        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = 'visibility';
            } else {
                field.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3500);
        }

        function triggerPasswordShake() {
            const wrapper = document.getElementById('password-wrapper');
            wrapper.classList.add('shake-input');
            setTimeout(() => { wrapper.classList.remove('shake-input'); }, 400);
        }

        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!currentPassword || !newPassword || !confirmPassword) {
                triggerPasswordShake();
                showToast("Please fill in all fields!");
                return;
            }

            if (newPassword.trim().length === 0) {
                triggerPasswordShake();
                showToast("New password cannot be empty!");
                return;
            }
            if (newPassword.length < 6) {
                triggerPasswordShake();
                showToast("New password must be at least 6 characters!");
                return;
            }
            if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                triggerPasswordShake();
                showToast("Password must include both letters and numbers!");
                return;
            }
            if (!/[@#$%&*=!?]/.test(newPassword)) {
                triggerPasswordShake();
                showToast("Password must include a special character (e.g., @, #)!");
                return;
            }
            if (newPassword !== confirmPassword) {
                triggerPasswordShake();
                showToast("New passwords do not match!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Updating...";

            const sessionKey = localStorage.getItem('session_key');

            try {
                const res = await fetch('/api/change-password/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Session-Key': sessionKey
                    },
                    credentials: 'include',
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showSuccessPopup("Your password has been changed successfully.");
                } else {
                    triggerPasswordShake();
                    showToast(data.message || "Failed to change password.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Save Changes";
                }
            } catch (err) {
                showToast("Cannot connect to server. Make sure Django is running.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Save Changes";
            }
        });
    </script>
</body>
</html>
