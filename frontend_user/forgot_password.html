<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Worknest — Reset Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght=200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ba1a1a",
              "on-surface": "#1c1c19",
              "primary": "#9f402d",
              "surface-container": "#f0ede8",
              "primary-container": "#e2725b",
              "inverse-surface": "#31302d",
              "secondary": "#635f40"
            },
            fontFamily: { "headline": ["Manrope"], "body": ["Manrope"] }
          },
        },
      }
    </script>
    <style>
        body {
            font-family: "Manrope", sans-serif;
            background-color: #fcf9f4;
            background-image: radial-gradient(circle at 20% 80%, rgba(214,231,161,0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,218,211,0.4) 0%, transparent 50%);
            min-height: max(884px, 100dvh);
        }
        .pebble-shadow { box-shadow: 0 20px 40px rgba(159, 64, 45, 0.06); }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-input { animation: shake 0.4s ease-in-out; border: 1.5px solid #ba1a1a !important; }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">

    <!-- Error Toast (red) -->
    <div id="toast-notification" class="fixed top-6 left-1/2 transform -translate-x-1/2 translate-y-[-100px] opacity-0 transition-all duration-500 max-w-sm w-full px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 z-50 pointer-events-none border border-white/10" style="background-color: #31302d;">
        <span class="material-symbols-outlined" style="color: #ffb4a5;">error</span>
        <span id="toast-text" class="text-sm font-bold tracking-wide flex-1" style="color: #ffb4a5;">Error message here</span>
    </div>

    <!-- Success Popup (green) -->
    <div id="success-popup" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:2rem; padding:2.5rem 2rem; max-width:340px; width:90%; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.2); animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);">
            <div style="width:72px;height:72px;background:linear-gradient(180deg,#fcf9f4,#9f402d);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
                <span class="material-symbols-outlined" style="color:white;font-size:2.2rem;font-variation-settings:'FILL' 1;">lock_reset</span>
            </div>
            <h3 style="font-size:1.3rem;font-weight:800;color:#1c1c19;margin-bottom:0.5rem;">Password Reset!</h3>
            <p id="success-popup-msg" style="color:#635f40;font-size:0.9rem;margin-bottom:1.5rem;">Your password has been reset successfully.</p>
            <button onclick="closeSuccessAndRedirect()" style="background:linear-gradient(180deg,#df573b,#9f402d);color:white;border:none;padding:0.85rem 2.5rem;border-radius:9999px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;">Go to Login</button>
        </div>
    </div>
    <style>
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>

    <main class="w-full max-w-md flex flex-col gap-12">
        <header class="flex flex-col items-center text-center gap-4">
            <div class="w-20 h-20 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center pebble-shadow mb-4">
                <span class="material-symbols-outlined text-white text-4xl">lock_reset</span>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter text-on-surface">Reset Password</h1>
            <p class="text-secondary max-w-[280px] leading-relaxed">Enter your registered email and set your new strong password.</p>
        </header>

        <section class="flex flex-col gap-6" id="forgot-section">
            <form id="forgot-password-form" class="flex flex-col gap-6" novalidate>
                
                <div class="flex items-center gap-3 p-2 bg-surface-container rounded-full pebble-shadow">
                    <span class="material-symbols-outlined text-secondary ml-4">email</span>
                    <div class="flex-1 py-1 px-2">
                        <input type="email" id="forgot-email" required placeholder="Registered Email Address" class="w-full bg-transparent border-none focus:ring-0 text-xl tracking-widest text-on-surface-variant font-medium outline-none">
                    </div>
                </div>
                
                <div id="password-wrapper" class="flex items-center gap-3 p-2 bg-surface-container rounded-full pebble-shadow relative border border-transparent transition-all duration-300">
                    <span class="material-symbols-outlined text-secondary ml-4">lock_open</span>
                    <div class="flex-1 py-1 pl-2 pr-12">
                        <input type="password" id="forgot-new-password" required placeholder="New Password" class="w-full bg-transparent border-none focus:ring-0 text-xl tracking-widest text-on-surface-variant font-medium outline-none">
                    </div>
                    <button type="button" onclick="toggleVisibility('forgot-new-password', 'eye-icon-1')" class="absolute right-5 text-secondary hover:text-primary focus:outline-none flex items-center justify-center">
                        <span class="material-symbols-outlined" id="eye-icon-1">visibility_off</span>
                    </button>
                </div>

                <div class="flex items-center gap-3 p-2 bg-surface-container rounded-full pebble-shadow relative">
                    <span class="material-symbols-outlined text-secondary ml-4">done_all</span>
                    <div class="flex-1 py-1 pl-2 pr-12">
                        <input type="password" id="forgot-confirm-password" required placeholder="Confirm New Password" class="w-full bg-transparent border-none focus:ring-0 text-xl tracking-widest text-on-surface-variant font-medium outline-none">
                    </div>
                    <button type="button" onclick="toggleVisibility('forgot-confirm-password', 'eye-icon-2')" class="absolute right-5 text-secondary hover:text-primary focus:outline-none flex items-center justify-center">
                        <span class="material-symbols-outlined" id="eye-icon-2">visibility_off</span>
                    </button>
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-white rounded-full font-bold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-300">
                    Reset Password Securely
                </button>
            </form>
            
            <div class="text-center text-sm font-medium text-on-surface-variant">
                Remember your password? <a href="{% url 'login_page' %}" class="text-primary underline font-bold">Back to Login</a>
            </div>
        </section>

        <footer class="mt-4 flex flex-col items-center gap-6">
            <div class="flex items-center gap-2 px-4 py-2 bg-tertiary/10 text-tertiary rounded-full">
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                <span class="text-[11px] font-bold uppercase tracking-widest text-secondary">Worknest Secure Recovery</span>
            </div>
        </footer>
    </main>

    <div class="fixed -top-20 -left-20 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl -z-10"></div>
    <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>

    <script>
        function showSuccessPopup(msg) {
            document.getElementById('success-popup-msg').textContent = msg;
            const popup = document.getElementById('success-popup');
            popup.style.display = 'flex';
        }

        function closeSuccessAndRedirect() {
            document.getElementById('success-popup').style.display = 'none';
            window.location.href = '{% url 'login_page' %}';
        }

        function toggleVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = 'visibility';
            } else {
                field.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3500);
        }

        function triggerPasswordShake() {
            const wrapper = document.getElementById('password-wrapper');
            wrapper.classList.add('shake-input');
            setTimeout(() => { wrapper.classList.remove('shake-input'); }, 400);
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const email = document.getElementById('forgot-email').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;
            const confirmPassword = document.getElementById('forgot-confirm-password').value;

            if (!email || !newPassword || !confirmPassword) {
                triggerPasswordShake();
                showToast("Please fill in all fields!");
                return;
            }

            if (newPassword.trim().length === 0) {
                triggerPasswordShake();
                showToast("Password cannot be empty or just spaces!");
                return;
            }
            if (newPassword.length < 6) {
                triggerPasswordShake();
                showToast("Password must be at least 6 characters long!");
                return;
            }
            if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                triggerPasswordShake();
                showToast("Password must include both letters and numbers!");
                return;
            }
            if (!/[@#$%&*=!?]/.test(newPassword)) {
                triggerPasswordShake();
                showToast("Password must include at least one special character (e.g., @, #)!");
                return;
            }
            if (newPassword !== confirmPassword) {
                triggerPasswordShake();
                showToast("New passwords do not match!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Resetting Password...";

            try {
                // 🎯 FIX: પાથ પાછળ સ્લેશ (/) અને 127.0.0.1 નો સચોટ સેટઅપ
               
                const res = await fetch('http://127.0.0.1:8000/api/forgot-password/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email: email, new_password: newPassword })
                });
                
                const data = await res.json();

                if (data.status === 'success') {
                    showSuccessPopup("Your password has been reset. Please log in with your new password.");
                } else {
                    triggerPasswordShake();
                    showToast(data.message || "Failed to reset password.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Reset Password Securely";
                }
            } catch (err) {
                // 💡 જો હજી પણ ભૂલ આવે, તો આનો મતલબ Django ની settings.py માં CORS બ્લોક છે
                showToast("Connection blocked. Check if Django is running & CORS is enabled.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password Securely";
            }
        });
    </script>
</body>
</html>
