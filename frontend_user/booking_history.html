<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking History — Worknest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Manrope', sans-serif; background: #fcf9f2; }</style>
</head>
<body class="min-h-screen text-[#1c1c18] pb-24">

<header class="sticky top-0 z-40 bg-[#fcf9f2]/90 backdrop-blur-md border-b border-[#ddc0ba]/20 px-6 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-full hover:bg-[#f1eee7]">
      <span class="material-symbols-outlined text-[#9f402d]">arrow_back</span>
    </button>
    <h1 class="font-black text-[#9f402d] text-xl">Your Hired Bookings</h1>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 py-8" id="history-container">
  <p class="text-center py-10 text-sm text-[#89726d]">Synchronizing booking history trails...</p>
</main>

<div id="rate-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
    <h3 class="text-xl font-black text-center text-[#1c1c18]">Rate the Service</h3>
    <p class="text-xs font-bold text-center text-[#89726d] uppercase tracking-wider">How was your experience?</p>
    
    <div class="flex items-center justify-center gap-2 py-2" id="star-row">
      <span class="material-symbols-outlined text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(1)">star</span>
      <span class="material-symbols-outlined text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(2)">star</span>
      <span class="material-symbols-outlined text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(3)">star</span>
      <span class="material-symbols-outlined text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(4)">star</span>
      <span class="material-symbols-outlined text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(5)">star</span>
    </div>

    <textarea id="rate-review" placeholder="Write a short review... (optional)" class="w-full p-3 text-sm bg-[#f6f3ec] border border-[#ddc0ba]/40 rounded-xl focus:outline-none resize-none" rows="3"></textarea>
    
    <button onclick="submitRating()" class="w-full py-3 bg-[#9f402d] text-white font-extrabold rounded-full text-sm uppercase tracking-wider shadow-md hover:bg-[#e2725b]">
      Submit Feedback
    </button>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api';
let selectedBookingId = null;
let currentRatingSelection = 5;

async function fetchHistory() {
  const sessionKey = localStorage.getItem('session_key');
  const container = document.getElementById('history-container');
  try {
    const res = await fetch(`${API}/bookings/`, { headers: { 'X-Session-Key': sessionKey } });
    const data = await res.json();
    if (data.status !== 'success' || !data.data.length) {
      container.innerHTML = `<div class='text-center py-10'><span class='material-symbols-outlined text-4xl text-[#ddc0ba]'>assignment_late</span><p class='text-sm font-bold text-[#89726d] mt-2'>No bookings log recorded yet.</p></div>`;
      return;
    }
    
    container.innerHTML = data.data.map(b => {
      let actionBtn = '';
      let statusColor = 'bg-yellow-50 text-yellow-700 border-yellow-200';
      
      if (b.status === 'in_progress') {
        statusColor = 'bg-blue-50 text-blue-700 border-blue-200';
        actionBtn = `<button onclick="closeBooking(${b.id})" class="w-full mt-4 py-2.5 bg-green-700 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-md hover:bg-green-600">Complete Booking & Calculate Pay</button>`;
      } else if (b.status === 'completed') {
        statusColor = 'bg-green-50 text-green-700 border-green-200';
        if (!b.rating_given) {
          actionBtn = `<button onclick="openRateModal(${b.id})" class="w-full mt-4 py-2.5 bg-white border-2 border-[#9f402d] text-[#9f402d] font-extrabold rounded-xl text-xs uppercase tracking-wider hover:bg-[#ffdad3]/30">Rate Worker</button>`;
        } else {
          actionBtn = `<p class="text-xs font-extrabold text-yellow-600 mt-3 flex items-center gap-1">⭐ Rated ${b.rating_given}/5 Stars</p>`;
        }
      } else if (b.status === 'accepted') {
        statusColor = 'bg-purple-50 text-purple-700 border-purple-200';
      }

      return `
        <div class="bg-white rounded-2xl p-5 border border-[#ddc0ba]/30 shadow-sm mb-4">
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-widest border ${statusColor}">${b.status.replace('_', ' ')}</span>
              <h3 class="font-extrabold text-[#1c1c18] text-lg mt-1">${b.worker_name}</h3>
              <p class="text-xs font-bold text-[#9f402d]">${b.worker_skill || 'Artisan'}</p>
            </div>
            <p class="text-sm font-black text-[#1c1c18]">${b.final_price ? '₹'+b.final_price : 'Hourly tracking'}</p>
          </div>
          <p class="text-sm text-[#56423e] font-medium mt-3 bg-[#f6f3ec]/60 p-3 rounded-xl border border-[#ddc0ba]/10">${b.service_desc}</p>
          ${actionBtn}
        </div>`;
    }).join('');
  } catch(e) { container.innerHTML = "<p class='text-center text-red-600 text-sm'>Failed to synchronize list records.</p>"; }
}

async function closeBooking(id) {
  const sessionKey = localStorage.getItem('session_key');
  if (!confirm("Are you sure the worker finished the job? This will calculate structural pricing fields and close the account assignment record lines.")) return;
  
  try {
    const res = await fetch(`${API}/bookings/`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
      body: JSON.stringify({ booking_id: id, status: 'completed' })
    });
    const data = await res.json();
    if (data.status === 'success') {
      openRateModal(id);
    } else { alert(data.message); }
  } catch(e) { alert("Operational failure connecting to view models."); }
}

function openRateModal(id) {
  selectedBookingId = id;
  setStar(5);
  document.getElementById('rate-review').value = '';
  document.getElementById('rate-modal').classList.remove('hidden');
}

function setStar(rating) {
  currentRatingSelection = rating;
  const stars = document.querySelectorAll('#star-row span');
  stars.forEach((s, idx) => {
    if (idx < rating) {
      s.classList.add('text-yellow-400', 'fill-icon');
      s.classList.remove('text-gray-300');
    } else {
      s.classList.remove('text-yellow-400', 'fill-icon');
      s.classList.add('text-gray-300');
    }
  });
}

async function submitRating() {
  const sessionKey = localStorage.getItem('session_key');
  try {
    const res = await fetch(`${API}/bookings/rate/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
      body: JSON.stringify({
        booking_id: selectedBookingId,
        rating: currentRatingSelection,
        review: document.getElementById('rate-review').value.trim()
      })
    });
    const data = await res.json();
    if (data.status === 'success') {
      document.getElementById('rate-modal').classList.add('hidden');
      fetchHistory();
    }
  } catch(e) { alert("Communication exception processing user evaluation parameters."); }
}

fetchHistory();
</script>
</body>
</html>
