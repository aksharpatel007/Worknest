<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — My Bookings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#fcf9f2",
            "on-background": "#1c1c18",
            "primary": "#9f402d",
            "primary-container": "#e2725b",
            "surface-lowest": "#ffffff",
            "surface-variant": "#f1eee7",
            "outline": "#ddc0ba"
          },
          fontFamily: { "body": ["Manrope"] }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fcf9f2;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    
    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }
  </style>
  <style id="global-hide-scrollbar">
    /* Hide scrollbar for Chrome, Safari and Opera */
    ::-webkit-scrollbar {
      display: none !important;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    html, body {
      -ms-overflow-style: none !important;  /* IE and Edge */
      scrollbar-width: none !important;  /* Firefox */
    }
  </style>
</head>

<body class="text-on-background pb-32 relative">
  <div class="fixed inset-0 grain z-[60] pointer-events-none"></div>

  <!-- Responsive Brand Header Deck -->
  <header class="sticky top-0 z-50 bg-[#fcf9f2]/80 backdrop-blur-xl shadow-[0_4px_20px_rgba(28,28,24,0.04)] border-b border-[#ddc0ba]/20 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between w-full">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#9f402d] text-2xl fill-icon">potted_plant</span>
        <!-- Header text adapts size dynamically according to laptop vs mobile frames -->
        <h1 class="text-2xl font-bold tracking-tight text-[#9f402d]">Worknest</h1>
      </div>
      <span class="material-symbols-outlined text-[#9f402d] text-2xl">history</span>
    </div>
  </header>

  <!-- Fluid Container Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
    <!-- Status Filter Tab Row -->
    <div class="flex gap-2.5 sm:gap-3 overflow-x-auto hide-scrollbar pb-2">
      <button onclick="filterBookings('all')" id="tab-all"
        class="px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-primary text-white shadow-md transition-all shrink-0">All</button>
      <button onclick="filterBookings('pending')" id="tab-pending"
        class="px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-surface-variant text-[#56423e] hover:bg-outline/40 transition-all shrink-0">Pending</button>
      <button onclick="filterBookings('in_progress')" id="tab-in_progress"
        class="px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-surface-variant text-[#56423e] hover:bg-outline/40 transition-all shrink-0">Active</button>
      <button onclick="filterBookings('completed')" id="tab-completed"
        class="px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-surface-variant text-[#56423e] hover:bg-outline/40 transition-all shrink-0">Completed</button>
    </div>

    <!-- Active Records Content Grid -->
    <div id="bookings-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <p class="text-center text-[#89726d] font-medium text-xs sm:text-sm italic mt-10 animate-pulse md:col-span-2">Loading your history...</p>
    </div>
  </main>

  <!-- Rating Feedback Overlay Modal Framework -->
  <div id="rate-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 sm:p-6 space-y-4 shadow-2xl transition-all border border-outline/20">
      <h3 class="text-xl font-black text-center text-[#1c1c18] tracking-tight">Rate the Service</h3>
      <p class="text-[10px] sm:text-xs font-bold text-center text-[#89726d] uppercase tracking-wider">How was your experience?</p>

      <div class="flex items-center justify-center gap-1.5 sm:gap-2 py-1" id="star-row">
        <span class="material-symbols-outlined text-2xl sm:text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(1)">star</span>
        <span class="material-symbols-outlined text-2xl sm:text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(2)">star</span>
        <span class="material-symbols-outlined text-2xl sm:text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(3)">star</span>
        <span class="material-symbols-outlined text-2xl sm:text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(4)">star</span>
        <span class="material-symbols-outlined text-2xl sm:text-3xl cursor-pointer text-gray-300 hover:text-yellow-400 transition-colors" onclick="setStar(5)">star</span>
      </div>

      <textarea id="rate-review" placeholder="Write a short review... (optional)"
        class="w-full p-3 text-xs sm:text-sm bg-[#f6f3ec] border border-[#ddc0ba]/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 resize-none text-on-background font-medium"
        rows="3"></textarea>

      <div class="flex gap-3 mt-2">
        <button onclick="closeRateModal()" class="w-1/3 py-3 bg-surface-variant text-[#56423e] font-bold rounded-full text-xs sm:text-sm transition-colors hover:bg-outline/30">Cancel</button>
        <button onclick="submitRating()" class="w-2/3 py-3 bg-primary text-white font-extrabold rounded-full text-xs sm:text-sm shadow-md hover:bg-primary-light transition-all active:scale-95">Submit Feedback</button>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 sm:p-6 space-y-4 shadow-2xl transition-all border border-outline/20 text-center">
      <div class="w-12 h-12 rounded-full bg-orange-50 text-[#9f402d] flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-2xl font-bold">help_outline</span>
      </div>
      <h3 id="confirm-title" class="text-lg font-black text-[#1c1c18] tracking-tight">Confirm Action</h3>
      <p id="confirm-message" class="text-xs sm:text-sm text-[#56423e] leading-relaxed font-medium"></p>
      <div class="flex gap-3 pt-2">
        <button id="confirm-cancel-btn" class="w-1/2 py-3 bg-surface-variant text-[#56423e] font-bold rounded-full text-xs sm:text-sm transition-colors hover:bg-outline/30">Cancel</button>
        <button id="confirm-ok-btn" class="w-1/2 py-3 bg-primary text-white font-extrabold rounded-full text-xs sm:text-sm shadow-md hover:bg-primary-light transition-all active:scale-95">Yes, Proceed</button>
      </div>
    </div>
  </div>

  <!-- Synchronized Bottom Global Menu Navigation Deck -->
  <nav class="fixed bottom-2 left-4 right-4 z-40 flex justify-around items-center px-2 sm:px-4 py-2 bg-[#fcf9f2]/90 backdrop-blur-2xl shadow-[0_10px_40px_rgba(28,28,24,0.06)] text-[10px] sm:text-[11px] font-semibold tracking-wide uppercase border border-outline-variant/30 rounded-2xl max-w-sm mx-auto">
    <a href="{% url 'dashboard_page' %}"
      class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl">home</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Home</span>
    </a>
    <a href="{% url 'services_page' %}"
      class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl">grid_view</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Services</span>
    </a>
    <a href="{% url 'booking_history_page' %}"
      class="flex flex-col items-center gap-1 bg-[#d6e7a1] text-[#56642b] rounded-full px-5 py-2">
      <span class="material-symbols-outlined text-xl fill-icon">event_note</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Bookings</span>
    </a>
    <a href="{% url 'profile_page' %}" class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl">person</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Profile</span>
    </a>
  </nav>

  <script>
    let toastTimeout;
    function showToast(message, type = 'success') {
      let toast = document.getElementById('custom-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'custom-toast';
        toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[100] transform transition-all duration-300 ease-out translate-y-[-100px] opacity-0 pointer-events-none max-w-sm w-full px-4';
        toast.innerHTML = `
          <div id="toast-content" class="bg-white border border-[#ddc0ba]/40 shadow-xl rounded-xl p-4 flex items-center gap-3">
            <div id="toast-icon-container" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0">
              <span id="toast-icon" class="material-symbols-outlined text-lg"></span>
            </div>
            <div>
              <p id="toast-message" class="text-xs sm:text-sm font-bold text-on-surface leading-tight"></p>
            </div>
          </div>
        `;
        document.body.appendChild(toast);
      }

      const content = document.getElementById('toast-content');
      const iconContainer = document.getElementById('toast-icon-container');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      clearTimeout(toastTimeout);

      if (type === 'success') {
        iconContainer.className = "w-8 h-8 rounded-full bg-[#d6e7a1]/40 text-[#56642b] flex items-center justify-center shrink-0";
        icon.textContent = "check_circle";
        content.className = "bg-white border border-[#d6e7a1]/50 shadow-xl rounded-xl p-4 flex items-center gap-3";
      } else if (type === 'error') {
        iconContainer.className = "w-8 h-8 rounded-full bg-red-50 text-red-600 flex items-center justify-center shrink-0";
        icon.textContent = "error";
        content.className = "bg-white border border-red-100 shadow-xl rounded-xl p-4 flex items-center gap-3";
      } else {
        iconContainer.className = "w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shrink-0";
        icon.textContent = "info";
        content.className = "bg-white border border-blue-100 shadow-xl rounded-xl p-4 flex items-center gap-3";
      }

      text.textContent = message;

      toast.offsetHeight; // force reflow

      toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      }, 3500);
    }

    function showConfirm(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirm-modal');
        const msgEl = document.getElementById('confirm-message');
        const okBtn = document.getElementById('confirm-ok-btn');
        const cancelBtn = document.getElementById('confirm-cancel-btn');

        msgEl.textContent = message;
        modal.classList.remove('hidden');

        function cleanup(result) {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }

        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    const API = '/api';
    let allBookings = [];
    let selectedBookingId = null;
    let currentRatingSelection = 5;

    async function loadBookings() {
      const sessionKey = localStorage.getItem('session_key');
      if (!sessionKey) { window.location.href = '{% url 'login_page' %}'; return; }

      try {
        const profileRes = await fetch(`${API}/profile/`, { headers: { 'X-Session-Key': sessionKey } });
        const profileData = await profileRes.json();
        if (profileData.status !== 'success') return;
        const clientId = profileData.data.id;

        const bookingsRes = await fetch(`${API}/bookings/`, { headers: { 'X-Session-Key': sessionKey } });
        const bookingsData = await bookingsRes.json();

        if (bookingsData.status === 'success') {
          // Store user bookings raw data array safely
          const rawDataList = bookingsData.data.filter(b => b.client == clientId || b.client_id == clientId);
          
          // Group pending by service_desc (reason)
          const pendingBookings = rawDataList.filter(b => b.status === 'pending');
          const nonPendingBookings = rawDataList.filter(b => b.status !== 'pending');

          const pendingGroups = {};
          pendingBookings.forEach(b => {
            if (!pendingGroups[b.service_desc]) {
              pendingGroups[b.service_desc] = [];
            }
            pendingGroups[b.service_desc].push(b);
          });

          const groupedPending = Object.keys(pendingGroups).map(desc => {
            const group = pendingGroups[desc];
            group.sort((x, y) => new Date(y.created_at || 0) - new Date(x.created_at || 0));
            const primary = group[0];
            return {
              ...primary,
              booking_ids: group.map(x => x.id)
            };
          });

          const finalDataList = [...nonPendingBookings, ...groupedPending];

          // 🎯 CRITICAL SORTING FIX: Compiles sorting rules using explicit timestamp strings so that the newest additions appear first
          finalDataList.sort((a, b) => {
            const timeStampA = new Date(a.created_at || a.completed_at || a.started_at || 0);
            const timeStampB = new Date(b.created_at || b.completed_at || b.started_at || 0);
            return timeStampB - timeStampA;
          });

          allBookings = finalDataList;
          renderBookings(allBookings);
        }
      } catch (e) {
        document.getElementById('bookings-container').innerHTML = `
          <p class="text-center text-primary font-bold text-sm mt-10 md:col-span-2">An exception occurred while retrieving active booking trails.</p>`;
      }
    }

    function filterBookings(status) {
      ['all', 'pending', 'in_progress', 'completed'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        if (btn) {
          if (tab === status) {
            btn.className = "px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-primary text-white shadow-md transition-all shrink-0";
          } else {
            btn.className = "px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-surface-variant text-[#56423e] hover:bg-outline/40 transition-all shrink-0";
          }
        }
      });

      let filtered = [];
      if (status === 'all') {
        filtered = allBookings;
      } else if (status === 'in_progress') {
        filtered = allBookings.filter(b => b.status === 'accepted' || b.status === 'in_progress');
      } else {
        filtered = allBookings.filter(b => b.status === status);
      }

      renderBookings(filtered);
    }

    function renderBookings(bookings) {
      const container = document.getElementById('bookings-container');
      if (bookings.length === 0) {
        container.innerHTML = `
          <div class="bg-surface-lowest p-8 sm:p-10 rounded-3xl text-center border border-outline/30 shadow-sm mt-6 md:col-span-2">
            <span class="material-symbols-outlined text-outline text-5xl sm:text-6xl mb-3">assignment_late</span>
            <h3 class="font-extrabold text-lg sm:text-xl mb-1">No Bookings Found</h3>
            <p class="text-xs sm:text-sm text-[#89726d]">You haven't made any requests in this category yet.</p>
          </div>`;
        return;
      }

      container.innerHTML = bookings.map(b => {
        let badgeConfig = { color: 'bg-orange-50 text-orange-700 border-orange-100', text: 'Pending Response', icon: 'schedule' };
        if (b.status === 'accepted') badgeConfig = { color: 'bg-purple-50 text-purple-700 border-purple-100', text: 'Accepted', icon: 'thumb_up' };
        if (b.status === 'in_progress') badgeConfig = { color: 'bg-blue-50 text-blue-700 border-blue-100', text: 'Active & In Progress', icon: 'handshake' };
        if (b.status === 'completed') badgeConfig = { color: 'bg-green-50 text-green-700 border-green-100', text: 'Job Completed', icon: 'check_circle' };
        if (b.status === 'cancelled' || b.status === 'rejected') badgeConfig = { color: 'bg-red-50 text-red-700 border-red-100', text: 'Cancelled', icon: 'cancel' };

        const assignmentTime = new Date(b.created_at || b.completed_at || b.started_at || new Date());
        const dateStr = assignmentTime.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const timeStr = assignmentTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        if (b.status === 'pending') {
          const isDirectRequest = b.worker_name && (!b.booking_ids || b.booking_ids.length <= 1);
          const titleText = isDirectRequest ? `Request to ${b.worker_name}` : "Finding Specialists";
          const subtitleHtml = isDirectRequest 
            ? `<p class="text-xs text-[#9f402d] font-bold mt-0.5">${b.worker_skill || 'Professional'}</p>`
            : `<p class="text-xs text-[#89726d] font-semibold mt-0.5">Finding nearby professionals</p>`;

          return `
          <div class="bg-white rounded-2xl p-5 border border-[#ddc0ba]/35 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between self-start">
            <div class="flex justify-between items-start gap-4 pb-3 border-b border-[#f1eee7]">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full ${badgeConfig.color} border text-[10px] font-bold uppercase tracking-wider">
                  <span class="material-symbols-outlined text-xs">${badgeConfig.icon}</span> ${badgeConfig.text}
                </div>
                <h3 class="font-extrabold text-base text-[#1c1c18] mt-2">${titleText}</h3>
                ${subtitleHtml}
                <p class="text-xs text-[#89726d] flex items-center gap-1 mt-1">
                  <span class="material-symbols-outlined text-xs">calendar_month</span> ${dateStr} • ${timeStr}
                </p>
              </div>
            </div>
            <div class="my-4">
              <span class="text-[10px] font-bold text-[#89726d] uppercase tracking-wider block mb-1">Requested Service</span>
              <p class="text-xs text-[#56423e] bg-[#fcf9f2] p-3 rounded-xl border border-[#ddc0ba]/20 leading-relaxed font-medium">"${b.service_desc}"</p>
            </div>
            <button onclick="cancelBookingGroup(${JSON.stringify(b.booking_ids || [b.id])})" class="w-full py-2.5 bg-red-50 hover:bg-red-600 hover:text-white text-red-600 font-bold rounded-xl text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5 border border-red-100">
              <span class="material-symbols-outlined text-sm">close</span> Cancel Request
            </button>
          </div>
          `;
        }

        let actionHtml = '';
        if (b.status === 'accepted' || b.status === 'in_progress') {
          let extraBtn = '';
          if (b.status === 'accepted') {
            extraBtn = `
              <button onclick="window.location.href='{% url 'map_page' %}?booking_id=${b.id}'" class="w-full py-2.5 bg-[#9f402d] hover:bg-[#e2725b] text-white font-bold rounded-xl text-xs shadow-sm transition-all active:scale-95 flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-sm">map</span> Track Live Location
              </button>`;
          }
          actionHtml = `
            <div class="flex flex-col gap-2">
              <button onclick="closeBooking(${b.id})" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xs shadow-sm transition-all active:scale-95 flex items-center justify-center gap-1">
                <span class="material-symbols-outlined text-sm">check</span> Mark as Completed
              </button>
              ${extraBtn}
            </div>`;
        }
        else if (b.status === 'completed') {
          if (!b.rating_given) {
            actionHtml = `
               <button onclick="openRateModal(${b.id})" class="w-full py-2.5 bg-white border border-[#9f402d] text-[#9f402d] hover:bg-[#ffdad3]/20 font-bold rounded-xl text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5">
                 <span class="material-symbols-outlined text-sm">star</span> Rate Worker
               </button>`;
          } else {
            actionHtml = `
               <p class="text-xs font-bold text-amber-600 flex items-center gap-1 bg-amber-50 border border-amber-100 px-3 py-1.5 rounded-xl w-fit">
                 <span class="material-symbols-outlined fill-icon text-sm text-amber-500">star</span> Rated ${b.rating_given}/5 Stars
               </p>`;
          }
        }

        return `
          <div class="bg-white rounded-2xl p-5 border border-[#ddc0ba]/30 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between self-start">
            <div class="flex justify-between items-start gap-4 pb-3 border-b border-[#f1eee7]">
              <div class="min-w-0">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full ${badgeConfig.color} border text-[10px] font-bold uppercase tracking-wider">
                  <span class="material-symbols-outlined text-xs">${badgeConfig.icon}</span> ${badgeConfig.text}
                </div>
                <h3 class="font-extrabold text-base text-[#1c1c18] mt-2 truncate leading-tight">${b.worker_name || 'Worker'}</h3>
                <p class="text-xs text-[#9f402d] font-bold mt-0.5">${b.worker_skill || 'Specialist'}</p>
                <p class="text-xs text-[#89726d] flex items-center gap-1 mt-1">
                  <span class="material-symbols-outlined text-xs">calendar_month</span> ${dateStr} • ${timeStr}
                </p>
              </div>
              <div class="text-right shrink-0">
                <span class="text-[9px] font-bold text-[#89726d] uppercase tracking-wider block">Price</span>
                <p class="text-base sm:text-lg font-black text-[#56642b] tracking-tight">${b.final_price ? '₹' + b.final_price : 'Hourly'}</p>
              </div>
            </div>
            <div class="my-4">
              <span class="text-[10px] font-bold text-[#89726d] uppercase tracking-wider block mb-1">Job Description</span>
              <p class="text-xs text-[#56423e] bg-[#fcf9f2] p-3 rounded-xl border border-[#ddc0ba]/20 leading-relaxed font-medium">"${b.service_desc}"</p>
            </div>
            ${actionHtml}
          </div>
        `;
      }).join('');
    }

    async function completeJob(bookingId) {
      const confirmed = await showConfirm("Are you sure? This will calculate the final price based on time spent and finish the booking.");
      if (!confirmed) return;

      const sessionKey = localStorage.getItem('session_key');
      try {
        const res = await fetch(`${API}/bookings/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
          body: JSON.stringify({ booking_id: bookingId, status: 'completed' })
        });

        const data = await res.json();
        if (data.status === 'success') {
          showToast("Job completed! The receipt has been sent to your notifications.", "success");
          loadBookings();
        } else {
          showToast("Error: " + data.message, "error");
        }
      } catch (e) { showToast("Failed to connect to the server.", "error"); }
    }

    async function cancelBooking(id) {
      const confirmed = await showConfirm("Are you sure you want to cancel this pending request?");
      if (!confirmed) return;
      try {
        const res = await fetch(`${API}/bookings/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-Session-Key': localStorage.getItem('session_key') },
          body: JSON.stringify({ booking_id: id, status: 'cancelled' })
        });

        if (res.ok || (await res.json()).status === 'success') {
          showToast("Booking cancelled successfully.", "success");
          loadBookings();
        } else {
          showToast('Failed to cancel. Please try again.', 'error');
        }
      } catch (e) { showToast('Network error while cancelling.', 'error'); }
    }

    async function cancelBookingGroup(ids) {
      const confirmed = await showConfirm("Are you sure you want to cancel this pending request?");
      if (!confirmed) return;
      try {
        let successCount = 0;
        for (const id of ids) {
          const res = await fetch(`${API}/bookings/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-Session-Key': localStorage.getItem('session_key') },
            body: JSON.stringify({ booking_id: id, status: 'cancelled' })
          });
          if (res.ok) {
            successCount++;
          }
        }
        if (successCount > 0) {
          showToast("Booking request cancelled successfully.", "success");
          loadBookings();
        } else {
          showToast('Failed to cancel. Please try again.', 'error');
        }
      } catch (e) { showToast('Network error while cancelling.', 'error'); }
    }

    async function closeBooking(id) {
      const sessionKey = localStorage.getItem('session_key');
      const confirmed = await showConfirm("Are you sure the worker finished the job? This will calculate the final price and notify the worker.");
      if (!confirmed) return;

      try {
        const res = await fetch(`${API}/bookings/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
          body: JSON.stringify({ booking_id: id, status: 'completed' })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast("Job completed! The receipt has been sent to both you and the worker.", "success");
          openRateModal(id);
          loadBookings();
        } else {
          showToast(data.message || "Error completing job", "error");
        }
      } catch (e) { showToast("Failed to connect to the server.", "error"); }
    }

    function openRateModal(id) {
      selectedBookingId = id;
      setStar(5);
      document.getElementById('rate-review').value = '';
      document.getElementById('rate-modal').classList.remove('hidden');
    }

    function closeRateModal() {
      document.getElementById('rate-modal').classList.add('hidden');
    }

    function setStar(rating) {
      currentRatingSelection = rating;
      const stars = document.querySelectorAll('#star-row span');
      stars.forEach((s, idx) => {
        if (idx < rating) {
          s.classList.add('text-yellow-400', 'fill-icon');
          s.classList.remove('text-gray-300');
        } else {
          s.classList.remove('text-yellow-400', 'fill-icon');
          s.classList.add('text-gray-300');
        }
      });
    }

    async function submitRating() {
      const sessionKey = localStorage.getItem('session_key');
      try {
        const res = await fetch(`${API}/bookings/rate/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
          body: JSON.stringify({
            booking_id: selectedBookingId,
            rating: currentRatingSelection,
            review: document.getElementById('rate-review').value.trim()
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast("Thank you for your rating!", "success");
          closeRateModal();
          loadBookings();
        }
      } catch (e) { showToast("Communication exception processing user evaluation parameters.", "error"); }
    }

    document.addEventListener("DOMContentLoaded", loadBookings);
  </script>
  <!-- Global URL Preview Hider -->
  <script id="global-hide-url-preview">
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
          link.setAttribute('data-href', href);
          link.removeAttribute('href');
          link.style.cursor = 'pointer';
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const target = link.getAttribute('data-href');
            if (e.ctrlKey || e.metaKey || link.getAttribute('target') === '_blank') {
              window.open(target, '_blank');
            } else {
              window.location.href = target;
            }
          });
        }
      });
    });
  </script>
