<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — Find Workers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fcf9f2;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    .cat-btn {
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: #9f402d;
      color: white;
    }

    .cat-btn:not(.active) {
      background: white;
      color: #56423e;
      border: 1px solid #ddc0ba;
    }



    .worker-card {
      transition: all 0.2s;
    }

    .worker-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(159, 64, 45, 0.1);
    }

    .hide-scroll::-webkit-scrollbar {
      display: none;
    }

    .hide-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen text-[#1c1c18] pb-32">
  <div class="fixed inset-0 grain z-[60] pointer-events-none"></div>

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#fcf9f2]/90 backdrop-blur-xl border-b border-[#ddc0ba]/20 px-6 py-4">
    <div class="max-w-5xl mx-auto w-full">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#9f402d] dark:text-[#ffb4a5] text-3xl"
            data-icon="potted_plant">potted_plant</span>
          <h1 class="text-2xl font-bold tracking-tight text-[#9f402d] dark:text-[#ffb4a5]">Worknest</h1>
        </div>
        <a href="{% url 'map_page' %}"
          class="flex items-center gap-1 text-sm font-bold text-[#9f402d] bg-[#ffdad3] px-4 py-2 rounded-full hover:bg-[#e2725b] hover:text-white transition-colors">
          <span class="material-symbols-outlined text-base fill-icon">map</span> Map View
        </a>
      </div>
      <!-- Search -->
      <div class="relative">
        <span
          class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#89726d] text-xl">search</span>
        <input type="text" id="search-input" placeholder="Search by name or skill..."
          class="w-full pl-12 pr-4 py-3 bg-white border border-[#ddc0ba] rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-[#9f402d]/20" />
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Category Filter -->
    <div class="flex gap-2 overflow-x-auto hide-scroll pb-1">
      <button class="cat-btn active flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('')"
        data-skill="">All</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Plumber')"
        data-skill="Plumber">🔧 Plumber</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold"
        onclick="filterSkill('Electrician')" data-skill="Electrician">⚡ Electrician</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('House Maid')"
        data-skill="House Maid">🧹 Maid</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Home Cook')"
        data-skill="Home Cook">🍳 Cook</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Carpenter')"
        data-skill="Carpenter">🪚 Carpenter</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Painter')"
        data-skill="Painter">🎨 Painter</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Gardener')"
        data-skill="Gardener">🌿 Gardener</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold"
        onclick="filterSkill('Baby Sitter')" data-skill="Baby Sitter">👶 Baby Sitter</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Labourer')"
        data-skill="Labourer">💪 Labourer</button>
      <button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill('Driver')"
        data-skill="Driver">🚗 Driver</button>
    </div>

    <!-- Grid Layout for Match Form & List -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- Instant Request Column -->
      <div class="lg:col-span-5 space-y-5">
        <!-- Instant Match Form -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#ddc0ba]/20 space-y-4">
          <div class="flex items-center gap-2 mb-1">
            <span class="material-symbols-outlined text-[#9f402d] text-xl font-bold">bolt</span>
            <h3 class="font-headline font-extrabold text-base text-[#1c1c18] tracking-tight">Instant Match & Request</h3>
          </div>
          <p class="text-xs text-[#89726d] leading-relaxed">
            Choose a service category and explain what you need. We'll automatically request the nearest online workers to help you.
          </p>
          
          <div class="space-y-3">
            <div>
              <label class="block text-[10px] font-bold text-[#89726d] uppercase tracking-wider mb-1">Service Category</label>
              <select id="quick-category" class="w-full px-4 py-2.5 bg-[#fcf9f2] border border-[#ddc0ba] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#9f402d]/20">
                <option value="" disabled selected>Select a category...</option>
              </select>
            </div>
            
            <div>
              <label class="block text-[10px] font-bold text-[#89726d] uppercase tracking-wider mb-1">Reason for Booking</label>
              <textarea id="quick-reason" rows="2" placeholder="e.g. Toilet plumbing leak, needs immediate repair" class="w-full px-4 py-2.5 bg-[#fcf9f2] border border-[#ddc0ba] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#9f402d]/20 resize-none"></textarea>
            </div>
            
            <div id="quick-msg" class="hidden text-xs font-bold p-3 rounded-xl"></div>
            
            <button id="quick-send-btn" onclick="sendQuickBooking()" class="w-full bg-gradient-to-r from-[#9f402d] to-[#e2725b] text-white py-3 rounded-xl font-bold text-sm shadow-md hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-1.5">
              <span class="material-symbols-outlined text-sm">send</span> Match & Send Request
            </button>
          </div>
        </div>
      </div>

      <!-- Workers List Column -->
      <div class="lg:col-span-7 space-y-3">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-[#1c1c18]" id="list-title">All Workers</h2>
          <div class="flex items-center gap-2">
            <label for="sort-select" class="text-xs font-bold text-[#89726d] uppercase tracking-wider">Sort by:</label>
            <select id="sort-select" onchange="sortAndRenderWorkers()" class="px-3 py-1.5 bg-white border border-[#ddc0ba] rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#9f402d]/20 text-[#56423e]">
              <option value="distance">Distance</option>
              <option value="rating">Rating</option>
              <option value="rate">Hourly Rate</option>
            </select>
          </div>
        </div>
        <div id="workers-list" class="space-y-4 lg:max-h-[600px] lg:overflow-y-auto lg:pr-2 hide-scroll">
          <div class="text-center py-8 text-[#89726d]">Loading workers...</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-2 left-4 right-4 z-40 flex justify-around items-center px-2 sm:px-4 py-2 bg-[#fcf9f2]/90 backdrop-blur-2xl shadow-[0_10px_40px_rgba(28,28,24,0.06)] text-[10px] sm:text-[11px] font-semibold tracking-wide uppercase border border-outline-variant/30 rounded-2xl max-w-sm mx-auto">
    <a href="{% url 'dashboard_page' %}"
      class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl">home</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Home</span>
    </a>
    <a href="{% url 'services_page' %}"
      class="flex flex-col items-center gap-1 bg-[#d6e7a1] text-[#56642b] rounded-full px-5 py-2">
      <span class="material-symbols-outlined text-xl">grid_view</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Services</span>
    </a>
    <a href="{% url 'booking_history_page' %}"
      class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl">event_note</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Bookings</span>
    </a>
    <a href="{% url 'profile_page' %}" class="flex flex-col items-center gap-1 text-[#56642b] opacity-50 px-5 py-2 hover:opacity-100 transition-all">
      <span class="material-symbols-outlined text-xl fill-icon">person</span>
      <span class="text-[11px] font-semibold uppercase tracking-wide">Profile</span>
    </a>
  </nav>

  <script>
    const API = '/api';
    let allWorkers = [];
    let userLat = null, userLon = null;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        
        // Save user live position coordinates (Phase 3)
        const sessionKey = localStorage.getItem('session_key');
        if (sessionKey) {
          fetch(`${API}/profile/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Session-Key': sessionKey },
            body: JSON.stringify({ latitude: userLat, longitude: userLon })
          }).catch(err => console.error("Error updating location profile:", err));
        }
        
        // Reload workers with user coordinates
        loadWorkers();
      });
    }

    function renderList(workers) {
      const el = document.getElementById('workers-list');
      if (!workers.length) { el.innerHTML = '<div class="text-center py-8 text-[#89726d]">No workers found for this category.</div>'; return; }
      el.innerHTML = workers.map(w => `
    <div class="worker-card bg-white rounded-2xl p-5 shadow-sm border border-[#ddc0ba]/20">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center gap-3">
          <div onclick="window.location.href='{% url 'worker_detail_page' %}?worker_id=${w.id}'" class="w-14 h-14 rounded-2xl bg-[#ffdad3] flex items-center justify-center text-xl font-black text-[#9f402d] cursor-pointer overflow-hidden hover:scale-105 active:scale-95 transition-all" title="View Profile Details">
            ${w.profile_pic 
              ? `<img src="${window.location.origin}${w.profile_pic}" alt="${w.fullname}" class="w-full h-full object-cover">`
              : w.fullname.charAt(0).toUpperCase()}
          </div>
          <div>
            <h3 class="font-bold text-[#1c1c18] text-base">${w.fullname}</h3>
            <p class="text-[#9f402d] font-semibold text-sm">${w.skill}</p>
          </div>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-bold bg-[#d6e7a1] text-[#56642b] uppercase">${w.worker_status || 'online'}</span>
      </div>
      <p class="text-sm text-[#56423e] mb-3 leading-relaxed">${w.bio || 'Experienced and reliable worker.'}</p>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 text-[11px] sm:text-xs text-[#56423e]">
          <span>⭐ ${w.rating.toFixed(1)} (${w.total_jobs} jobs)</span>
          ${w.hourly_rate ? `<span>• ₹${w.hourly_rate}/hr</span>` : ''}
          ${w.distance_text ? `<span>• 📍 ${w.distance_text}</span>` : ''}
          ${w.is_available ? '<span class="text-green-600 font-bold">• Available</span>' : '<span class="text-gray-400">• Busy</span>'}
        </div>
       <a href="{% url 'booking_request_page' %}?worker_id=${w.id}" 
          class="bg-[#9f402d] text-white text-sm font-bold px-5 py-2 rounded-full hover:bg-[#e2725b] transition-colors">
          Book
        </a>
      </div>
    </div>
  `).join('');
    }

    function sortAndRenderWorkers() {
      const sortBy = document.getElementById('sort-select').value;
      const q = document.getElementById('search-input').value.toLowerCase();
      
      let filtered = [...allWorkers];
      if (q) {
        filtered = filtered.filter(w => 
          (w.fullname || "").toLowerCase().includes(q) || 
          (w.username || "").toLowerCase().includes(q) || 
          (w.email || "").toLowerCase().includes(q) || 
          (w.skill || "").toLowerCase().includes(q)
        );
      }
      
      if (sortBy === 'distance') {
        filtered.sort((a, b) => a.distance - b.distance);
      } else if (sortBy === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (sortBy === 'rate') {
        filtered.sort((a, b) => a.hourly_rate - b.hourly_rate);
      }
      
      renderList(filtered);
    }

    async function loadWorkers(skill = '') {
      try {
        let url = `${API}/workers/`;
        const params = [];
        if (skill) params.push(`skill=${encodeURIComponent(skill)}`);
        if (userLat !== null && userLon !== null) {
          params.push('latitude=' + userLat);
          params.push('longitude=' + userLon);
        }
        if (params.length > 0) {
          url += '?' + params.join('&');
        }

        const sessionKey = localStorage.getItem('session_key');
        const headers = {};
        if (sessionKey) {
          headers['X-Session-Key'] = sessionKey;
        }

        const res = await fetch(url, { headers });
        const data = await res.json();
        if (data.status === 'success') {
          allWorkers = data.data;
          sortAndRenderWorkers();
          document.getElementById('list-title').textContent = skill ? skill + 's (' + allWorkers.length + ')' : 'All Workers (' + allWorkers.length + ')';
        }
      } catch (e) {
        document.getElementById('workers-list').innerHTML = '<div class="text-center py-8 text-[#89726d]">Start the server to see workers.</div>';
      }
    }

    const categories = [
      { name: 'Plumber', emoji: '🔧' },
      { name: 'Electrician', emoji: '⚡' },
      { name: 'Carpenter', emoji: '🪚' },
      { name: 'Painter', emoji: '🎨' },
      { name: 'Mason (Mistri)', emoji: '🧱' },
      { name: 'Appliance Repair', emoji: '🔌' },
      { name: 'House Maid', emoji: '🧹' },
      { name: 'Laundry / Dhobi', emoji: '🧺' },
      { name: 'Cleaning Specialist', emoji: '🧼' },
      { name: 'Cook / Chef', emoji: '🍳' },
      { name: 'Gardener', emoji: '🌿' },
      { name: 'Car Washer', emoji: '🧽' },
      { name: 'Security Guard', emoji: '🛡️' },
      { name: 'Driver', emoji: '🚗' },
      { name: 'Mechanic', emoji: '⚙️' }
    ];

    function renderCategories() {
      const container = document.querySelector('.flex.gap-2.overflow-x-auto');
      if (container) {
        let html = '<button class="cat-btn active flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill(\'\')" data-skill="">All</button>';
        categories.forEach(cat => {
          html += '<button class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold" onclick="filterSkill(\'' + cat.name + '\')" data-skill="' + cat.name + '">' + cat.emoji + ' ' + cat.name + '</button>';
        });
        container.innerHTML = html;
      }

      const select = document.getElementById('quick-category');
      if (select) {
        select.innerHTML = '<option value="" disabled selected>Select a category...</option>';
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.name;
          opt.textContent = cat.emoji + ' ' + cat.name;
          select.appendChild(opt);
        });
      }
    }

    async function sendQuickBooking() {
      const category = document.getElementById('quick-category').value;
      const reason = document.getElementById('quick-reason').value.trim();
      const btn = document.getElementById('quick-send-btn');
      const msgEl = document.getElementById('quick-msg');
      const sessionKey = localStorage.getItem('session_key');

      function showQuickMsg(text, type) {
        msgEl.textContent = text;
        msgEl.className = 'text-xs font-bold p-3 rounded-xl ' + (type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
        msgEl.classList.remove('hidden');
      }

      if (!sessionKey) {
        showQuickMsg('Please login to send requests.', 'error');
        return;
      }
      if (!category) {
        showQuickMsg('Please select a service category.', 'error');
        return;
      }
      if (!reason) {
        showQuickMsg('Please describe what help you need.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> Requesting nearest workers...';
      msgEl.classList.add('hidden');

      try {
        // 1. Fetch nearest workers in this category
        let url = API + '/workers/?skill=' + encodeURIComponent(category);
        if (userLat !== null && userLon !== null) {
          url += '&latitude=' + userLat + '&longitude=' + userLon;
        }
        
        const workersRes = await fetch(url);
        const workersData = await workersRes.json();
        
        if (workersData.status !== 'success' || !workersData.data || workersData.data.length === 0) {
          showQuickMsg('No online ' + category + 's found near you.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> Match & Send Request';
          return;
        }

        // Take up to top 3 nearest workers
        const nearestWorkers = workersData.data.slice(0, 3);

        // 2. Fetch current profile to get client ID securely
        const profileRes = await fetch(API + '/profile/', {
          headers: { 'X-Session-Key': sessionKey }
        });
        const profileData = await profileRes.json();

        if (profileData.status !== 'success') {
          showQuickMsg('Your session expired. Please sign in again.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> Match & Send Request';
          return;
        }

        const loggedInClientId = profileData.data.id;

        // 3. Create booking request for each nearby worker in parallel
        const bookingPromises = nearestWorkers.map(w => {
          return fetch(API + '/bookings/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Session-Key': sessionKey
            },
            credentials: 'include',
            body: JSON.stringify({
              worker_id: parseInt(w.id),
              client_id: parseInt(loggedInClientId),
              service_desc: reason
            })
          }).then(res => res.json());
        });

        const results = await Promise.all(bookingPromises);
        const successes = results.filter(r => r.status === 'success');

        if (successes.length > 0) {
          showQuickMsg('Request sent to ' + successes.length + ' nearby worker(s)!', 'success');
          setTimeout(() => window.location.href = '{% url 'booking_history_page' %}', 2000);
        } else {
          const errorMsg = results[0]?.message || 'Could not send request. Try again.';
          showQuickMsg(errorMsg, 'error');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> Match & Send Request';
        }
      } catch (err) {
        showQuickMsg('Cannot connect to server.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> Match & Send Request';
      }
    }

    function filterSkill(skill) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.skill === skill);
      });
      loadWorkers(skill);
    }

    // Search
    document.getElementById('search-input').addEventListener('input', e => {
      sortAndRenderWorkers();
    });

    renderCategories();
    loadWorkers();
  </script>
</body>

</html>
