<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Worknest — Find Experts</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: '#9f402d',
                        'primary-light': '#e2725b',
                        'primary-container': '#ffdad3',
                        surface: '#fcf9f2',
                        'surface-container': '#f1eee7',
                        'surface-container-low': '#f6f3ec',
                        'on-surface': '#1c1c18',
                        secondary: '#56642b',
                        'secondary-container': '#d6e7a1',
                        outline: '#89726d',
                        'outline-variant': '#ddc0ba'
                    },
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    borderRadius: { DEFAULT: '1rem', lg: '2rem', xl: '3rem', full: '9999px' },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background: #fcf9f2;
            color: #1c1c18;
        }

        .grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-sans min-h-screen pb-32">
    <div class="fixed inset-0 grain z-0 pointer-events-none"></div>

    <header
        class="sticky top-0 z-40 bg-[#fcf9f2]/85 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-[#ddc0ba]/20">
        <div class="flex items-center gap-2.5">
            <div
                class="w-9 h-9 rounded-full bg-[#9f402d] flex items-center justify-center shadow-md shadow-[#9f402d]/10">
                <span class="material-symbols-outlined text-white text-lg fill-icon">potted_plant</span>
            </div>
            <span class="text-xl md:text-2xl font-black text-[#9f402d] tracking-tight">Worknest</span>
        </div>

        <div class="flex items-center gap-2">
            <a href="/worker/messages/"
                class="p-2 bg-[#f1eee7]/60 hover:bg-[#ffdad3]/50 text-[#56423e] hover:text-[#9f402d] transition-all rounded-full relative">
                <span class="material-symbols-outlined text-2xl">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-[#9f402d] rounded-full ring-2 ring-[#fcf9f2]"></span>
            </a>
            <a href="/worker/profile/"
                class="w-10 h-10 rounded-full border-2 border-[#9f402d]/30 overflow-hidden hover:border-[#9f402d] transition-all p-0.5 bg-white shadow-sm">
                <img id="header-avatar"
                    src="https://ui-avatars.com/api/?name=Marcus%20Chen&amp;background=ffdad3&amp;color=9f402d&amp;bold=true"
                    class="w-full h-full object-cover rounded-full">
            </a>
        </div>
    </header>


    <main class="relative z-10 pt-10 px-6 max-w-2xl lg:max-w-4xl mx-auto space-y-6">
        <section class="space-y-4">
            <h2 class="text-2xl md:text-3xl font-black text-on-surface tracking-tight">Find Experts</h2>

            <div class="flex gap-2">
                <div class="relative w-full mx-auto">
                    <span
                        class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline">search</span>

                    <input type="text" placeholder="Search for plumber, maid, cook..."
                        class="w-full bg-white border border-outline-variant rounded-full py-4 pl-14 pr-32 text-sm md:text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 text-on-surface"
                        id="network-search" onkeypress="handleEnter(event)">

                    <button onclick="addSearchChip()"
                        class="absolute right-2 top-2 bottom-2 bg-primary text-white px-6 rounded-full font-bold text-xs md:text-sm hover:bg-primary-light transition-colors shadow-md">Search</button>
                </div>
            </div>

            <div id="chip-container" class="flex flex-wrap gap-2 pt-2"></div>
        </section>

        <div id="explorer-cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8"></div>
    </main>

    <nav
        class="fixed bottom-2 left-4 right-4 z-50 flex justify-between items-center px-4 py-2 bg-[#fcf9f2]/90 backdrop-blur-2xl border border-outline-variant/30 rounded-2xl shadow-lg max-w-sm mx-auto">
        <style>
            .nav-item {
                color: #89726d;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                border-radius: 12px;
            }

            .nav-item.active {
                color: #56642b !important;
                background: #d6e7a1;
                transform: scale(1.05);
            }
        </style>
        <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="/worker/dashboard/"
            id="nav-home">
            <span class="material-symbols-outlined text-[20px]">home_work</span>
            <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">Home</span>
        </a>
        <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="/worker/requests/"
            id="nav-requests">
            <span class="material-symbols-outlined text-[20px]">hail</span>
            <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">Requests</span>
        </a>
        <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="/worker/booking-history/"
            id="nav-history">
            <span class="material-symbols-outlined text-[20px]">calendar_today</span>
            <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">History</span>
        </a>
        <a class="nav-item active flex flex-col items-center justify-center px-3 py-2" href="/worker/search/"
            id="nav-search">
            <span class="material-symbols-outlined text-[20px]">search</span>
            <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">search</span>
        </a>
    </nav>

    <script>
        const API_BASE = '/api';
        let activeSearchChips = new Set();

        // Load persistent chips out of memory cache immediately
        const savedData = localStorage.getItem('worknest_active_searches');
        if (savedData) {
            activeSearchChips = new Set(JSON.parse(savedData));
        }

        window.onload = () => {
            renderChips();
            updateView();
        };

        // Added quick check to catch empty images/avatars safely without breaking scripts
        document.addEventListener("DOMContentLoaded", () => {
            const hAvatar = document.getElementById('header-avatar');
            if (hAvatar && !hAvatar.getAttribute('src')) {
                hAvatar.src = "https://ui-avatars.com/api/?name=Marcus%20Chen&background=ffdad3&color=9f402d&bold=true";
            }
        });

        function saveChipsToMemory() {
            localStorage.setItem('worknest_active_searches', JSON.stringify(Array.from(activeSearchChips)));
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSearchChip();
            }
        }

        // Universal Avatar Handler
        function getAvatarUrl(person, themeColor = '713f12') {
            if (person && person.profile_pic) {
                return person.profile_pic.startsWith('http')
                    ? person.profile_pic
                    : `${window.location.origin}${person.profile_pic}`;
            }
            const name = encodeURIComponent(person ? (person.fullname || person.username || 'User') : 'User');
            return `https://ui-avatars.com/api/?name=${name}&background=ffdad3/&color=9f402d`;
        }

        async function updateView() {
            const sessionKey = localStorage.getItem('session_key');
            if (!sessionKey) return;

            try {
                // 1. Fetch current logged-in user profile metrics 
                const myRes = await fetch(`${API_BASE}/profile/`, { headers: { 'X-Session-Key': sessionKey } });
                const myData = await myRes.json();
                const me = myData.data;
                const myProfession = (me?.skill || '').toLowerCase();

                // Sync the header navigation photo row dynamically
                const headerAvatar = document.getElementById('header-avatar');
                if (headerAvatar) {
                    headerAvatar.src = getAvatarUrl(me);
                }

                // 2. Safely capture data stream via clean directory endpoint
                const res = await fetch(`${API_BASE}/workers/`);
                if (!res.ok) throw new Error("Network connection exception encountered.");

                const data = await res.json();
                let workers = data.data || [];

                // 3. Match Local Search Filters 
                if (activeSearchChips.size > 0) {
                    const searchTerms = Array.from(activeSearchChips).map(chip => chip.toLowerCase());
                    workers = workers.filter(w => {
                        const name = (w.fullname || w.username || '').toLowerCase();
                        const skill = (w.skill || '').toLowerCase();
                        return searchTerms.some(term => name.includes(term) || skill.includes(term));
                    });
                }

                // 4. Sort: Match active expert role classification types first
                workers.sort((a, b) => {
                    const aMatch = (a.skill || '').toLowerCase() === myProfession;
                    const bMatch = (b.skill || '').toLowerCase() === myProfession;

                    if (aMatch && !bMatch) return -1;
                    if (!aMatch && bMatch) return 1;
                    return 0;
                });

                renderNetworkCards(workers);
            } catch (error) {
                console.error("Error updating views:", error);
                document.getElementById('explorer-cards-grid').innerHTML = `
                    <p class="text-xs md:text-sm font-medium text-primary col-span-full text-center py-6">
                        Unable to load experts. Please check your network connection.
                    </p>`;
            }
        }

        function renderChips() {
            const container = document.getElementById('chip-container');
            container.innerHTML = Array.from(activeSearchChips).map(chip => `
            <div class="bg-primary/10 border border-primary/20 px-4 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold text-primary">
                <span>${chip}</span>
                <button onclick="removeChip('${chip}')" class="text-primary hover:text-primary-light transition-colors flex items-center">
                    <span class="material-symbols-outlined text-sm font-bold">close</span>
                </button>
            </div>
            `).join('');
        }

        function addSearchChip() {
            const input = document.getElementById('network-search');
            const val = input.value.trim();
            if (val && !activeSearchChips.has(val)) {
                activeSearchChips.add(val);
                saveChipsToMemory();
                renderChips();
                input.value = '';
                updateView();
            }
        }

        function removeChip(val) {
            activeSearchChips.delete(val);
            saveChipsToMemory();
            renderChips();
            updateView();
        }

        function renderNetworkCards(arr) {
            const grid = document.getElementById('explorer-cards-grid');
            if (!arr || arr.length === 0) {
                grid.innerHTML = `
                    <p class="text-xs md:text-sm font-medium text-outline col-span-full text-center py-12">
                        No experts found matching your search matrix parameters.
                    </p>`;
                return;
            }

            // Inside the dynamic map rendering: updated the header name text to be responsive (text-sm on mobile, text-base on laptop)
            grid.innerHTML = arr.map(w => `
             <div onclick="window.location.href='/worker/detail/?worker_id=${w.id}'" class="bg-white p-5 rounded-2xl border border-outline-variant/30 flex items-center gap-4 hover:shadow-md transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
                <img class="w-14 h-14 rounded-full object-cover border-2 border-[#713f12]/20 shadow-sm shrink-0" 
                     src="${getAvatarUrl(w)}" 
                     alt="Profile Picture">
                <div class="overflow-hidden">
                    <h4 class="font-sans font-bold text-sm md:text-base text-on-surface truncate">${w.fullname || w.username}</h4>
                    <span class="inline-flex bg-secondary-container text-secondary text-[10px] font-extrabold px-3 py-1 rounded-full mt-1.5 uppercase tracking-wider">
                        ${w.skill || 'Expert'}
                    </span>
                </div>
            </div>
            `).join('');
        }
    </script>
</body>

</html>
