<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — Job Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fcf9f2;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    nav a {
      min-width: 60px;
      /* Ensures buttons don't squish */
      text-decoration: none;
    }

    /* Active state highlight */
    nav a[href*="current_filename.html"] {
      color: #ea580c !important;
      /* Primary color */
      background: #ffedd5;
      /* Primary container */
      border-radius: 12px;
    }

    /* Premium Filter Tabs */
    .tab-btn {
      border: 1px solid #e2e8f0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: #9f402d !important;
      color: white !important;
      box-shadow: 0 6px 15px rgba(159, 64, 45, 0.25);
      border-color: #9f402d;
    }

    /* Elegant Action Buttons */
    .btn-base {
      padding: 0.75rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 16px;
      /* Soft pill */
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-complete {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2);
    }

    .btn-complete:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
    }

    .btn-cancel {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
    }

    .btn-cancel:hover {
      background: #dc2626;
      color: white;
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="text-[#1c1c18] pb-32">

  <header
    class="sticky top-0 z-40 bg-[#fcf9f2]/90 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-outline-variant/20">

    <!-- Left Side: Logo and Title -->
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-[#9f402d] text-2xl fill-icon">potted_plant</span>

      <span class="text-2xl font-black text-[#9f402d] tracking-tight">Worknest</span>
    </div>

    <!-- Right Side: Icons -->
    <div class="flex items-center gap-4">
      <a href="worker_messages.html" class="text-slate-600 hover:text-teal-700 transition-colors">
        <span class="material-symbols-outlined text-2xl">notifications</span>
      </a>

      <!-- Profile (User Icon) -->
      <a href="worker_profile.html"
        class="w-9 h-9 rounded-full border-2 border-[9f402d] overflow-hidden hover:border-[9f402d] transition-all">
        <img src="https://ui-avatars.com/api/?name=Marcus%20Chen&amp;background=ffdad3&amp;color=9f402d&amp;bold=true"
          class="w-full h-full object-cover rounded-full">
      </a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-6 py-8">
    <div class="flex gap-2 overflow-x-auto pb-6 scrollbar-hide">
      <!-- Example of uniform button structure -->
      <button onclick="filterBookings('all')" id="tab-all"
        class="tab-btn active px-6 py-2.5 rounded-full text-sm font-bold bg-primary text-white">All</button>
      <button onclick="filterBookings('pending')" id="tab-pending"
        class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-[#56423e]">Pending</button>
      <button onclick="filterBookings('in_progress')" id="tab-in_progress"
        class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-[#56423e]">Active</button>
      <button onclick="filterBookings('completed')" id="tab-completed"
        class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-[#56423e]">Completed</button>
    </div>

    <div id="bookings-container" class="space-y-4">
      <p class="text-center text-[#89726d] py-10">Synchronizing records...</p>
    </div>
  </main>

  <nav
    class="fixed bottom-2 left-4 right-4 z-50 flex justify-between items-center px-4 py-2 bg-[#fcf9f2]/90 backdrop-blur-2xl border border-[#ddc0ba]/30 rounded-2xl shadow-lg">
    <style>
      .nav-item {
        color: #89726d;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 12px;
      }

      .nav-item.active {
        color: #56642b !important;
        background: #d6e7a1;
        transform: scale(1.05);
      }
    </style>

    <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="worker_dashboard.html" id="nav-home">
      <span class="material-symbols-outlined text-[20px]">home_work</span>
      <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">Home</span>
    </a>

    <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="worker_requests.html"
      id="nav-requests">
      <span class="material-symbols-outlined text-[20px]">hail</span>
      <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">Requests</span>
    </a>

    <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="worker_booking_history.html"
      id="nav-history">
      <span class="material-symbols-outlined text-[20px]">calendar_today</span>
      <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">History</span>
    </a>

    <a class="nav-item flex flex-col items-center justify-center px-3 py-2" href="worker_search.html" id="nav-search">
      <span class="material-symbols-outlined text-[20px]">search</span>
      <span class="text-[8px] font-bold uppercase tracking-widest mt-0.5">search</span>
    </a>
  </nav>

  <script>

    const path = window.location.pathname;
    if (path.includes('dashboard')) document.getElementById('nav-home').classList.add('active');
    else if (path.includes('requests')) document.getElementById('nav-requests').classList.add('active');
    else if (path.includes('booking_history')) document.getElementById('nav-history').classList.add('active');
    else if (path.includes('search')) document.getElementById('nav-search').classList.add('active');


    const API = 'http://localhost:8000/api';
    let allBookings = [];

    async function loadBookings() {
      const sessionKey = localStorage.getItem('session_key');
      const res = await fetch(`${API}/bookings/`, { headers: { 'X-Session-Key': sessionKey } });
      const data = await res.json();
      if (data.status === 'success') {
        allBookings = data.data.reverse();
        renderBookings(allBookings);
      }
    }

    function renderBookings(bookings) {
      const container = document.getElementById('bookings-container');
      if (bookings.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-[#89726d] italic">No activity recorded.</div>`;
        return;
      }

      container.innerHTML = bookings.map(b => {
        // Timeline status indicators
        const statusMap = {
          'pending': { color: 'bg-amber-500', label: 'Awaiting Response' },
          'accepted': { color: 'bg-green-500', label: 'Accepted — Awaiting Start' },
          'in_progress': { color: 'bg-emerald-500', label: 'Active Service' },
          'completed': { color: 'bg-blue-800', label: 'Finished' },
          'cancelled': { color: 'bg-red-500', label: 'Cancelled' }
        };
        const status = statusMap[b.status] || statusMap['pending'];

        return `
          <div class="bg-white p-6 rounded-3xl border border-[#ddc0ba]/20 shadow-sm transition-all hover:shadow-md">
            <div class="flex justify-between items-start mb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-[#ffdad3] flex items-center justify-center font-black text-[#9f402d] text-lg">
                  ${b.worker_name ? b.worker_name.charAt(0) : 'W'}
                </div>
                <div>
                  <h3 class="font-bold text-[#1c1c18]">${b.worker_name || 'Expert'}</h3>
                  <p class="text-[10px] uppercase tracking-widest font-black text-[#9f402d]">${b.worker_skill || 'Worker'}</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded-full ${status.color}"></span>
                <span class="text-[12px] font-black uppercase text-[#89726d]">${status.label}</span>
              </div>
            </div>

            <div class="bg-[#fcf9f2] p-4 rounded-2xl border border-[#ddc0ba]/30 mb-4">
              <p class="text-sm italic text-[#56423e]">"${b.service_desc}"</p>
            </div>

            <div class="flex justify-between items-center border-t border-[#f1eee7] pt-4">
              <div class="text-sm font-black text-[#1c1c18]">
                ${b.final_price ? `₹${b.final_price}` : '<span class="text-[#89726d] text-xs">Awaiting Calculation</span>'}
              </div>
              
              <div class="flex gap-3">
                ${b.status === 'pending' ? `
                  <button onclick="cancelBooking(${b.id})" class="btn-base btn-cancel flex-1">
                    Cancel
                  </button>` : ''}
                
                ${(b.status === 'in_progress' || b.status === 'accepted') ? `
                  <button onclick="closeBooking(${b.id})" class="btn-base btn-complete flex-1">
                    Finalize Job
                  </button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelBooking(id) {
      if (!confirm("Are you sure?")) return;
    }

    async function completeJob(id) {
      const res = await fetch(`${API}/bookings/`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Session-Key': localStorage.getItem('session_key') },
        body: JSON.stringify({ booking_id: id, status: 'completed' })
      });
      if ((await res.json()).status === 'success') {
        alert("Receipt details sent to your notifications!");
        loadBookings();
      }
    }

    function filterBookings(status) {
      // 1. Remove 'active' from all, add to selected
      const tabs = ['all', 'pending', 'in_progress', 'completed'];
      tabs.forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        if (!btn) return;

        if (tab === status) {
          btn.classList.add('active', 'bg-primary', 'text-white');
          btn.classList.remove('bg-white', 'text-[#56423e]');
        } else {
          btn.classList.remove('active', 'bg-primary', 'text-white');
          btn.classList.add('bg-white', 'text-[#56423e]');
        }
      });

      // 2. Filter logic... (your existing filter code remains the same)
      let filtered = status === 'all' ? allBookings :
        status === 'in_progress' ? allBookings.filter(b => b.status === 'accepted' || b.status === 'in_progress') :
          allBookings.filter(b => b.status === status);

      renderBookings(filtered);
    }

    loadBookings();
  </script>
</body>

</html>
