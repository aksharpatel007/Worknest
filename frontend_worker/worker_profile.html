<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Worknest — Profile Settings</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ea580c",
            "surface": "#ffffff",
            "on-surface": "#0f172a",
            "on-surface-variant": "#475569",
            "surface-container-low": "#f6f3ec",
            "surface-container-highest": "#e5e2db",
            "background": "#fcf4ed",
            "outline-variant": "#ddc0ba"
          },
          fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Be Vietnam Pro"] },
        },
      },
    }
  </script>
  <style>
    .paper-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-surface text-on-surface font-body min-h-screen pb-32">
  <div class="fixed inset-0 paper-grain z-0"></div>

  <div id="verification-shield-screen"
    class="hidden relative z-50 min-h-screen flex flex-col items-center justify-center px-6 text-center bg-[#fcf4ed]">
    <div class="bg-[#f6f3ec] max-w-md p-10 border border-[#ddc0ba]/40 shadow-xl space-y-6 rounded-[2rem]">
      <div
        class="w-20 h-20 bg-amber-100 text-[#ea580c] rounded-full flex items-center justify-center mx-auto shadow-inner animate-pulse">
        <span class="material-symbols-outlined text-4xl">hourglass_empty</span>
      </div>
      <h2 class="font-headline text-3xl font-extrabold text-[#0f172a]">Verification Pending</h2>
      <p class="text-[#475569] text-sm leading-relaxed">
        Welcome to Worknest! You cannot access your professional worker panel utilities until an administrator approves
        your profile details and identity credentials.
      </p>

      <div class="bg-white p-4 rounded-2xl border border-[#ddc0ba] text-left space-y-3">
        <label class="text-[10px] font-bold uppercase tracking-widest text-[#475569] ml-1">Message System
          Administration</label>
        <textarea id="pending-msg-input"
          placeholder="Type a note or ask the admin for a status check on your registration documents..."
          class="w-full p-4 bg-[#fcf4ed]/50 border border-[#ddc0ba]/40 focus:border-[#ea580c] rounded-xl text-xs outline-none resize-none font-medium text-[#0f172a]"
          rows="3"></textarea>
        <button id="send-pending-btn" onclick="sendVerificationMessage()"
          class="w-full py-3 bg-[#ea580c] text-white font-bold text-xs rounded-xl shadow-md uppercase tracking-wider hover:opacity-90 transition-opacity">
          Send Note to Admin
        </button>
      </div>

      <button onclick="localStorage.clear(); window.location.href='../frontend_user/login.html'"
        class="w-full py-4 bg-stone-200 hover:bg-stone-300 text-[#475569] font-bold rounded-2xl text-sm transition-colors">
        Sign Out Safely
      </button>
    </div>
  </div>


  <header
    class="fixed top-0 w-full z-50 bg-[#fcf9f2] backdrop-blur-xl flex justify-between items-center px-6 py-4 border-b border-outline-variant/20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary fill-icon">person</span>
      </div>
      <h1 class="font-headline font-bold text-xl tracking-tight text-orange-800">My Profile</h1>
    </div>
  </header>

  <main class="relative z-10 pt-24 px-6 max-w-2xl mx-auto space-y-6">
    <form id="owner-profile-form"
      class="bg-surface-container-low p-6 rounded-[2rem] border border-outline-variant/20 space-y-4"
      enctype="multipart/form-data">
      <div class="flex flex-col items-center space-y-3">
        <div class="relative group w-20 h-20 rounded-full overflow-hidden border-2 border-primary">
           <img src="https://ui-avatars.com/api/?name=Marcus%20Chen&amp;background=ffdad3&amp;color=9f402d&amp;bold=true" class="w-full h-full object-cover rounded-full">
          <input type="file" name="profile_pic" id="file-selector" class="hidden" accept="image/*">
          <label for="file-selector"
            class="absolute inset-0 bg-black/50 text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer">Edit</label>
        </div>
        <h3 id="my-name-title" class="font-headline font-bold text-base">Artisan</h3>
      </div>
      <div class="space-y-3">
        <input type="text" name="fullname" id="my-fullname-input" required
          class="w-full p-3.5 bg-white border border-outline-variant/40 rounded-xl text-sm" placeholder="Full Name" />
        <input type="tel" name="phone" id="my-phone-input" required
          class="w-full p-3.5 bg-white border border-outline-variant/40 rounded-xl text-sm" placeholder="Phone" />
        <textarea name="bio" id="my-bio-input"
          class="w-full p-3.5 bg-white border border-outline-variant/40 rounded-xl text-sm resize-none" rows="2"
          placeholder="Experience details..."></textarea>
      </div>
      <button type="submit"
        class="w-full py-3 bg-primary text-white font-bold text-xs rounded-full uppercase tracking-wider">Save
        Changes</button>
    </form>

  </main>


  <script>

    const API_BASE = 'http://localhost:8000/api';
    let globalWorkersList = [];

    async function checkCurrentStatus() {
      const sessionKey = localStorage.getItem('session_key');
      if (!sessionKey) { window.location.href = '../frontend_user/login.html'; return; }

      try {
        const res = await fetch(`${API_BASE}/profile/`, {
          headers: { 'X-Session-Key': sessionKey, 'Content-Type': 'application/json' },
          credentials: 'include'
        });
        const data = await res.json();

        if (data.status === 'success' && data.data) {
          const worker = data.data;

          // 🛡️ THE ABSOLUTE VERIFICATION GUARD LAYER
          if (worker.is_verified === false) {
            // Force display the message screen and keep all real components completely hidden!
            document.getElementById('verification-shield-screen').classList.remove('hidden');

            // Hide your active headers, bento grids, navigation decks, and main lists
            const mainElements = document.querySelectorAll('header, main, nav');
            mainElements.forEach(el => {
              if (el.id !== 'verification-shield-screen' && !el.contains(document.getElementById('verification-shield-screen'))) {
                el.classList.add('hidden');
              }
            });
            return;
          }

          // If verified, proceed with your page rendering logic normally as written...
        }
      } catch (e) { console.error("Identity status validation breakdown:", e); }
    }

    // 📩 Transmit the message straight into the worker's bio field model row
    async function sendVerificationMessage() {
      const note = document.getElementById('pending-msg-input').value.trim();
      if (!note) { alert("Please input a message first."); return; }

      const btn = document.getElementById('send-pending-btn');
      btn.textContent = "Transmitting message...";
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/profile/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Key': localStorage.getItem('session_key') },
          body: JSON.stringify({ bio: `VERIFICATION_NOTE: ${note}` }) // Store note cleanly inside the bio string block
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert("Your message note has been appended to your validation files. The admin will review it immediately.");
          document.getElementById('pending-msg-input').value = "";
          btn.textContent = "Note Sent ✓";
        }
      } catch (e) { console.error(e); btn.textContent = "Send Note to Admin"; btn.disabled = false; }
    }


    
    initializeProfileExplorer();
    checkCurrentStatus();
  </script>
</body>

</html>
