<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Worknest — Add Your Details (Step 2)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Manrope', sans-serif; background: #fcf9f2; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .grain { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; }
</style>
</head>
<body class="min-h-screen text-[#1c1c18]">
<div class="fixed inset-0 grain z-[60] pointer-events-none"></div>

<!-- Header -->
<header class="sticky top-0 z-50 bg-[#fcf9f2]/90 backdrop-blur-xl border-b border-[#ddc0ba]/20 px-6 py-4 flex items-center gap-4">
  <button onclick="history.back()" class="p-2 rounded-full hover:bg-[#f1eee7] transition-colors">
    <span class="material-symbols-outlined text-[#9f402d]">arrow_back</span>
  </button>
  <div>
    <h1 class="font-black text-[#9f402d] text-lg">Step 2 of 3 — Your Work Details</h1>
    <p class="text-xs text-[#56423e]">Tell people about your work so they can find you</p>
  </div>
</header>

<!-- Progress Bar -->
<div class="w-full bg-[#f1eee7] h-1.5">
  <div class="bg-[#9f402d] h-1.5 rounded-full" style="width: 66%"></div>
</div>

<main class="max-w-xl mx-auto px-6 py-10 space-y-6">

  <div id="error-msg" class="text-red-600 text-sm font-bold hidden text-center bg-red-50 p-3 rounded-xl"></div>

  <!-- Bio -->
  <div class="space-y-2">
    <label class="block text-xs font-bold uppercase tracking-widest text-[#56423e]">About You</label>
    <textarea id="bio" rows="4" placeholder="Example: I am a plumber with 5 years of experience. I fix leaks, install pipes, and do all water-related work quickly and cleanly." class="w-full p-4 bg-white border border-[#ddc0ba] rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-[#9f402d]/20 resize-none"></textarea>
    <p class="text-xs text-[#89726d]">This shows on your profile. Write in simple words.</p>
  </div>

  <!-- Hourly Rate -->
  <div class="space-y-2">
    <label class="block text-xs font-bold uppercase tracking-widest text-[#56423e]">Your Rate (₹ per hour)</label>
    <div class="flex items-center gap-3 bg-white border border-[#ddc0ba] rounded-2xl px-4 py-3">
      <span class="text-[#9f402d] font-bold text-lg">₹</span>
      <input type="number" id="hourly_rate" placeholder="e.g. 300" min="50" max="5000" class="flex-1 bg-transparent text-base focus:outline-none text-[#1c1c18]"/>
      <span class="text-[#89726d] text-sm">/hr</span>
    </div>
    <p class="text-xs text-[#89726d]">Set a fair rate. You can change it later.</p>
  </div>

  <!-- Profile Photo -->
  <div class="space-y-2">
    <label class="block text-xs font-bold uppercase tracking-widest text-[#56423e]">Your Photo (optional)</label>
    <label class="flex flex-col items-center justify-center gap-3 p-8 bg-white border-2 border-dashed border-[#ddc0ba] rounded-2xl cursor-pointer hover:border-[#9f402d] transition-colors">
      <span class="material-symbols-outlined text-[#9f402d] text-4xl" style="font-variation-settings:'FILL' 1;">add_a_photo</span>
      <span class="text-sm font-semibold text-[#56423e]">Tap to add your photo</span>
      <span class="text-xs text-[#89726d]">A clear face photo helps clients trust you</span>
      <input type="file" id="profile_pic" accept="image/*" class="hidden"/>
    </label>
    <div id="photo-preview" class="hidden">
      <img id="preview-img" class="w-24 h-24 rounded-full object-cover mx-auto border-4 border-[#ffdad3]"/>
    </div>
  </div>

  <!-- Continue Button -->
  <button onclick="saveDetails()" class="w-full py-4 bg-[#9f402d] text-white font-bold rounded-full text-lg hover:bg-[#e2725b] transition-all active:scale-95 shadow-lg shadow-[#9f402d]/20 flex items-center justify-center gap-2">
    Continue to Final Step
    <span class="material-symbols-outlined">arrow_forward</span>
  </button>

  <button onclick="window.location.href='worker_signup_step_3.html'" class="w-full py-3 text-[#89726d] font-semibold text-sm hover:text-[#9f402d] transition-colors">
    Skip for now →
  </button>
</main>

<script>
// Show photo preview
document.getElementById('profile_pic').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('preview-img').src = ev.target.result;
      document.getElementById('photo-preview').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }
});

async function saveDetails() {
  const bio = document.getElementById('bio').value.trim();
  const rate = document.getElementById('hourly_rate').value.trim();
  const picFile = document.getElementById('profile_pic').files[0];
  const errEl = document.getElementById('error-msg');

  const formData = new FormData();
  if (bio) formData.append('bio', bio);
  if (rate) formData.append('hourly_rate', rate);
  if (picFile) formData.append('profile_pic', picFile);

  try {
    const res = await fetch('http://localhost:8000/api/profile/', {
      method: 'POST',
      credentials: 'include',
      body: formData
    });
    const data = await res.json();
    if (data.status === 'success') {
      window.location.href = 'worker_signup_step_3.html';
    } else {
      errEl.textContent = data.message || 'Could not save. Please try again.';
      errEl.classList.remove('hidden');
    }
  } catch(e) {
    // If server not running, just go to next step
    window.location.href = 'worker_signup_step_3.html';
  }
}
</script>
</body>
</html>
