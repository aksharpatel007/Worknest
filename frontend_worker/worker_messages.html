<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest — Job Receipts Ledger</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: '#9f402d',
            'primary-light': '#e2725b',
            'primary-container': '#ffdad3',
            surface: '#fcf9f2',
            'surface-container': '#f1eee7',
            'surface-container-low': '#f6f3ec',
            'on-surface': '#1c1c18',
            secondary: '#56642b',
            'secondary-container': '#d6e7a1',
            outline: '#89726d',
            'outline-variant': '#ddc0ba'
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'] },
          borderRadius: { DEFAULT: '1rem', lg: '2rem', xl: '3rem', full: '9999px' },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fcf9f2;
      color: #1c1c18;
    }

    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="min-h-screen bg-surface text-on-surface font-sans pb-20">
  <div class="fixed inset-0 grain z-[60] pointer-events-none"></div>

  <!-- Responsive Header Deck -->
  <header
    class="sticky top-0 z-40 bg-[#fcf9f2]/90 backdrop-blur-md border-b border-outline-variant/20 px-4 sm:px-6 py-4 flex items-center gap-2 sm:gap-4">
    <button onclick="window.location.href='/worker/dashboard/'"
      class="p-2 rounded-full hover:bg-surface-container transition-colors flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-primary font-bold text-xl sm:text-2xl">arrow_back</span>
    </button>
    <div class="flex items-center gap-2 sm:gap-3 overflow-hidden">
      <span class="material-symbols-outlined text-primary text-xl sm:text-2xl fill-icon shrink-0">receipt_long</span>
      <h2 class="text-xl sm:text-2xl md:text-3xl font-black text-on-surface tracking-tight truncate">Payment Receipts
      </h2>
    </div>
  </header>

  <!-- Responsive Scaled Main Viewport Layout -->
  <main class="pt-6 sm:pt-10 px-4 sm:px-6 max-w-3xl lg:max-w-5xl mx-auto">
    <div id="receipt-container"
      class="grid grid-cols-1 gap-4 p-4 sm:p-6 bg-white rounded-2xl sm:rounded-3xl border border-outline-variant/30 shadow-sm">

      <!-- Dynamic Content Loader Frame -->
      <div id="loading-spinner" class="text-center py-12 md:col-span-2">
        <p class="text-sm font-semibold text-outline animate-pulse">Retrieving your financial records...</p>
      </div>

    </div>
  </main>

  <script>
    const API_BASE = '/api';

    async function fetchLiveReceipts() {
      const sessionKey = localStorage.getItem('session_key');
      const container = document.getElementById('receipt-container');

      if (!container) return;

      try {
        const res = await fetch(`${API_BASE}/bookings/`, {
          method: 'GET',
          headers: {
            'X-Session-Key': sessionKey,
            'Content-Type': 'application/json'
          }
        });

        const response = await res.json();

        if (response.status !== 'success' || !response.data) {
          throw new Error("Invalid backend data format structure blueprint.");
        }

        // Filter for completed jobs
        const completedJobs = response.data.filter(job => job.status === 'completed');

        if (completedJobs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 md:col-span-2">
              <span class="material-symbols-outlined text-4xl text-outline/40 mb-2 block">folder_open</span>
              <p class="text-sm font-semibold text-outline">No completed job receipts found in your ledger.</p>
            </div>`;
          return;
        }

        // 🎯 FIXED: Explicit Sort by Date & Time to guarantee the NEWEST message/receipt is always on top
        completedJobs.sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));

        container.innerHTML = completedJobs.map(job => {
          // Format both local date stamp and accurate time arrays cleanly
          const timestamp = new Date(job.completed_at);
          const dateStr = timestamp.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
          const timeStr = timestamp.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

          return `
          <div class="border-l-4 border-l-secondary shadow-sm hover:shadow-md transition-all duration-300 rounded-xl sm:rounded-2xl bg-surface-container-low p-4 sm:p-5 flex justify-between items-center gap-4 border border-outline-variant/20">
            <div class="space-y-1 sm:space-y-1.5 overflow-hidden">
              <!-- Fonts automatically adjust size based on mobile vs laptop screens -->
              <h4 class="font-sans font-black text-sm sm:text-base md:text-lg text-on-surface truncate leading-tight">${job.service_desc}</h4>
              <p class="text-[11px] sm:text-xs font-bold text-secondary uppercase tracking-wider flex items-center gap-1">
                <span class="material-symbols-outlined text-xs sm:text-sm fill-icon">person</span> Client: ${job.client_name}
              </p>
              <p class="text-[10px] sm:text-xs font-semibold text-outline flex items-center gap-1">
                <span class="material-symbols-outlined text-xs sm:text-sm">schedule</span> ${dateStr} • ${timeStr}
              </p>
            </div>
            <div class="text-right shrink-0 flex flex-col items-end gap-1.5">
              <p class="text-base sm:text-xl md:text-2xl font-black text-primary tracking-tight">₹${job.final_price}</p>
              <div class="w-7 h-7 sm:w-9 sm:h-9 bg-secondary-container text-secondary rounded-full flex items-center justify-center shadow-inner">
                <span class="material-symbols-outlined text-sm sm:text-base font-black">check</span>
              </div>
            </div>
          </div>
          `;
        }).join('');

      } catch (e) {
        console.error("Database connection exception generated:", e);
        container.innerHTML = `
          <div class="text-center py-12 md:col-span-2">
            <span class="material-symbols-outlined text-3xl text-primary mb-1">error</span>
            <p class="text-sm font-bold text-primary">Error: Could not load accounting records cleanly.</p>
          </div>`;
      }
    }

    fetchLiveReceipts();
  </script>
</body>

</html>
