<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker Job Summary Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Manrope', sans-serif; background: #fffbf7; }</style>
</head>
<body class="min-h-screen text-slate-900 pb-10">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-orange-100 px-6 py-4 flex items-center gap-3">
  <button onclick="window.location.href='worker_dashboard.html'" class="p-2 rounded-full hover:bg-orange-50">
    <span class="material-symbols-outlined text-orange-600">arrow_back</span>
  </button>
  <h1 class="font-black text-slate-800 text-xl">Completed Job Updates</h1>
</header>

<main class="max-w-xl mx-auto px-6 py-6 space-y-4" id="worker-inbox">
  <p class="text-center text-sm text-slate-400 py-10">Loading execution charts...</p>
</main>

<script>
async function loadWorkerInbox() {
  const sessionKey = localStorage.getItem('session_key');
  try {
    const res = await fetch('http://localhost:8000/api/notifications/', {
      headers: { 'X-Session-Key': sessionKey }
    });
    const data = await res.json();
    const box = document.getElementById('worker-inbox');
    
    if (data.status !== 'success' || !data.data.length) {
      box.innerHTML = `<div class='text-center py-10'><span class='material-symbols-outlined text-4xl text-slate-300'>history_toggle_off</span><p class='text-sm font-bold text-slate-400 mt-2'>No operational history logs broadcast yet.</p></div>`;
      return;
    }
    
    box.innerHTML = data.data.map(n => `
      <div class="bg-white border border-orange-50 rounded-2xl p-5 shadow-sm space-y-2">
        <div class="flex justify-between items-start border-b border-slate-50 pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500"></span> ${n.title}</h3>
          <span class="text-[10px] text-slate-400 font-semibold">${n.formatted_date}</span>
        </div>
        <p class="text-xs font-mono font-medium text-slate-600 whitespace-pre-line bg-slate-50 p-4 rounded-xl leading-relaxed border border-slate-100">${n.message}</p>
      </div>`).join('');
  } catch(e) { }
}
loadWorkerInbox();
</script>
</body>
</html>
