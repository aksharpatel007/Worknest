<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Job Summary Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fffbf7;
    }
  </style>
</head>

<body class="min-h-screen text-slate-900 pb-10">

  <header
    class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-orange-100 px-6 py-4 flex items-center gap-3">
    <button onclick="window.location.href='worker_dashboard.html'" class="p-2 rounded-full hover:bg-orange-50">
      <span class="pt-1 material-symbols-outlined text-teal-800">arrow_back</span>
    </button>
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-teal-700">receipt_long</span>
      <h2 class="text-2xl font-black text-slate-900">Payment Receipts</h2>
    </div>
  </header>

  <main class="pt-9 px-3 max-w-xxl mx-auto space-y-">

    <div id="receipt-container" class="space-y-4  p-4 bg-white rounded-lg shadow-sm">
      <!-- Dynamic Content Loads Here -->
      <div id="loading-spinner" class="text-center py-10">
        <p class="text-sm font-bold text-slate-400 animate-pulse">Retrieving your financial records...</p>
      </div>
    </div>
  </main>

  <script>
    // 1. Define the variable first
    const API_BASE = 'http://localhost:8000/api';

    // 2. Define the function second
    async function fetchLiveReceipts() {
      const sessionKey = localStorage.getItem('session_key');
      const container = document.getElementById('receipt-container');

      if (!container) return; // Guard against missing element

      container.innerHTML = '<p class="text-center text-slate-400 animate-pulse">Loading receipts...</p>';

      try {
        const res = await fetch(`${API_BASE}/bookings/`, {
          method: 'GET',
          headers: {
            'X-Session-Key': sessionKey,
            'Content-Type': 'application/json'
          }
        });

        const response = await res.json();

        if (response.status !== 'success' || !response.data) {
          throw new Error("Invalid data format");
        }

        const completedJobs = response.data.filter(job => job.status === 'completed');

        if (completedJobs.length === 0) {
          container.innerHTML = '<p class="text-center text-slate-400">No completed receipts found.</p>';
          return;
        }

        container.innerHTML = completedJobs.map(job => `
        <div class="premium-card border-l-4 border-l-teal-700 shadow-lg hover:shadow-md transition-shadow rounded-lg bg-white">
          <div class="px-2 py-2 flex justify-between items-start">
            <div>
              <h4 class="font-bold text-slate-800 mt-1">${job.service_desc}</h4>
              <p class="text-[12px] text-teal-800 font-bold mt-1">Client: ${job.client_name}</p>
              <p class="text-[11px] text-slate-800 mt-0.5">${new Date(job.completed_at).toLocaleDateString()}</p>
            </div>
            <div class="text-right">
              <p class="font-black text-slate-900">₹${job.final_price}</p>
              <img src="https://cdn-icons-png.flaticon.com/128/14018/14018771.png" loading="lazy" alt="Done " title="Done " width="50" height="50">
            </div>
          </div>
        </div>
      `).join('');

      } catch (e) {
        console.error("Database connection error:", e);
        container.innerHTML = '<p class="text-center text-red-500 text-sm">Error: Could not load records.</p>';
      }
    }

    // 3. Call the function only after both variable and function are defined
    fetchLiveReceipts();
  </script>

</body>

</html>
