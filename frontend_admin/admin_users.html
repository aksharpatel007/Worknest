<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worknest Admin — Verified Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #faf7f2;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      color: #56423e;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.6);
      color: #9f402d;
    }

    .nav-link.active {
      background: white;
      color: #9f402d;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(159, 64, 45, 0.1);
    }
  </style>
</head>

<body class="h-screen flex overflow-hidden text-[#1c1c18]">

  <aside id="admin-sidebar"
    class="fixed md:sticky top-0 left-0 -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col w-64 h-screen bg-[#f5f0e8] shadow-2xl md:shadow-lg z-40 py-8 shrink-0 overflow-y-auto">
    <div class="px-6 mb-8 flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full bg-gradient-to-br from-[#9f402d] to-[#e2725b] flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-xl"
          style="font-variation-settings: 'FILL' 1;">potted_plant</span>
      </div>
      <div>
        <h1 class="font-black text-[#9f402d] text-lg leading-tight">Worknest</h1>
        <p class="text-xs text-[#89726d] font-medium">Admin Panel</p>
      </div>

      <button onclick="document.getElementById('admin-sidebar').classList.add('-translate-x-full')"
        class="md:hidden p-2 rounded-full text-[#89726d] hover:bg-[#ddc0ba]/40 transition-colors flex items-center justify-center absolute top-7 right-1">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
    </div>
    <nav class="flex-1 flex flex-col gap-1 px-3">
      <a href="admin_dashboard.html" class="nav-link"><span class="material-symbols-outlined text-xl">dashboard</span>
        Dashboard</a>
      <a href="admin_users.html" class="nav-link active"><span class="material-symbols-outlined text-xl">group</span>
        Verify Users</a>
      <a href="admin_verify.html" class="nav-link"><span class="material-symbols-outlined text-xl">verified_user</span>
        Verify Workers</a>
      <a href="admin_booking.html" class="nav-link"><span class="material-symbols-outlined text-xl">receipt_long</span>
        System Bookings</a>
      <a href="admin_fraud.html" class="nav-link"><span class="material-symbols-outlined text-xl">gavel</span> Fraud
        Reports</a>
      <a href="admin_settings.html" class="nav-link"><span class="material-symbols-outlined text-xl">settings</span>
        Settings</a>
    </nav>
    <div class="px-3 mt-4 border-t border-[#ddc0ba]/40 pt-4">
      <a href="#" onclick="adminLogout()" class="nav-link text-red-600"><span
          class="material-symbols-outlined text-xl">logout</span> Sign Out</a>
    </div>
  </aside>

  <main class="flex-1 h-full overflow-y-auto flex flex-col min-w-0">
    <header
      class="sticky top-0 z-40 bg-[#faf7f2]/90 backdrop-blur-md flex items-center justify-between px-8 py-4 border-b border-[#ddc0ba]/20">
      <div class="flex items-center gap-3">
        <button onclick="document.getElementById('admin-sidebar').classList.toggle('-translate-x-full')"
          class="md:hidden p-2 rounded-full hover:bg-[#ddc0ba]/30 transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined text-[#9f402d]">more_vert</span>
        </button>
        <h2 class="text-xl md:text-2xl font-black text-[#1c1c18]">Verify Users</h2>
      </div>
    </header>

    <div class="mb-6 relative group px-6 ">
      <span
        class="material-symbols-outlined absolute left-9 top-1/2 -translate-y-1/2 text-[#89726d] group-focus-within:text-[#9f402d] transition-colors">person_search</span>
      <input type="text" id="user-search" onkeyup="handleUserSearch()"
        placeholder="Search for clients by name or email..."
        class="w-full pl-12 pr-6 py-4 bg-white rounded-2xl border border-[#ddc0ba]/30 shadow-sm focus:ring-2 focus:ring-[#9f402d]/20 outline-none transition-all text-sm font-medium">
    </div>

    <div class="p-8 max-w-7xl w-full mx-auto">
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-[#ddc0ba]/20">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-[#f6f3ec] text-xs font-bold uppercase tracking-widest text-[#89726d]">
              <tr>
                <th class="px-8 py-5">User</th>
                <th class="px-8 py-5">Email</th>
                <th class="px-8 py-5">Joined Date</th>
                <th class="px-8 py-5">Actions</th>
              </tr>
            </thead>
            <tbody id="verified-users-table" class="divide-y divide-[#f1eee7] text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="user-modal"
    class="hidden fixed inset-0 z-[9999] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div
      class="bg-white rounded-[2.5rem] w-full max-w-4xl max-h-[85dvh] overflow-hidden shadow-2xl flex flex-col border border-white/20">
      <div class="p-6 border-b border-[#f1eee7] flex justify-between items-center bg-[#faf7f2]">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[#9f402d]">person_search</span>
          <h3 class="text-xl font-black text-[#9f402d]">Client Activity Profile</h3>
        </div>
        <button onclick="closeModal('user-modal')"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 text-[#89726d] transition-colors">✕</button>
      </div>

      <div id="modal-content" class="p-8 overflow-y-auto bg-white">
      </div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:8000/api';

    function adminLogout() {
      localStorage.removeItem('session_key');
      window.location.href = '../frontend_user/login.html';
    }

    //
    let rawUserData = []; // Global variable to store the master list

    async function loadVerifiedUsers() {
      const tbody = document.getElementById('verified-users-table');
      try {
        const res = await fetch(`${API}/admin/users/`, {
          headers: { 'X-Session-Key': localStorage.getItem('session_key') },
          credentials: 'include'
        });
        const data = await res.json();

        if (data.status === 'success') {
          // Store only Role 3 (Clients) for this specific page
          rawUserData = data.data.filter(u => u.role_id == 3);

          // Initial render of the full list
          renderUserTable(rawUserData);
        }
      } catch (e) {
        console.error("Error loading users:", e);
      }
    }

    function handleUserSearch() {
      const query = document.getElementById('user-search').value.toLowerCase();

      // Filter the global master list
      const filtered = rawUserData.filter(u => {
        const nameMatch = (u.fullname || "").toLowerCase().includes(query);
        const emailMatch = (u.email || "").toLowerCase().includes(query);
        return nameMatch || emailMatch;
      });

      renderUserTable(filtered);
    }

    // Ensure your render function matches the one called by search
    function renderUserTable(users) {
      const tbody = document.getElementById('verified-users-table');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-10 text-center text-[#89726d]">No clients match your search.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-[#fcf9f2] transition-colors cursor-pointer group" >
            <td class="px-8 py-5 flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-[#9f402d] overflow-hidden border border-[#ddc0ba]/40 group-hover:ring-2 ring-[#9f402d]">
                    <img src="${u.profile_pic ? 'http://localhost:8000' + u.profile_pic : 'https://ui-avatars.com/api/?name=' + u.fullname}" class="w-full h-full object-cover">
                </div>
                <div>
                    <p class="font-bold text-[#1c1c18]">${u.fullname}</p>
                    <p class="text-[10px] text-[#89726d] uppercase tracking-widest font-black">Verified User</p>
                </div>
            </td>
            <td class="px-8 py-5 text-[#56423e] font-medium">${u.email}</td>
            <td class="px-8 py-5 text-[#89726d]">${new Date(u.date_joined).toLocaleDateString('en-IN')}</td>
            <td class="px-8 py-5" onclick="openUserDetail(${u.id})">
                <button class="px-4 py-2 hover:bg-[#9f402d] hover:text-white border border-[#ddc0ba]/60 rounded-lg text-xs font-bold text-[#9f402d]">View History</button>
            </td>
        </tr>
    `).join('');
    }

    async function openUserDetail(userId) {
      const modal = document.getElementById('user-modal');
      const content = document.getElementById('modal-content');
      modal.classList.remove('hidden');
      content.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#9f402d]"></div></div>';

      try {
        // 1. Find the user info from our local master list
        const user = rawUserData.find(u => u.id === userId);

        // 2. Fetch bookings filtering by client_id 
        // Ensure your backend 'get_all_bookings' view is prepared to filter or 
        // we filter the results here in the frontend to be 100% sure.
        const res = await fetch(`${API}/admin/bookings/`, {
          headers: { 'X-Session-Key': localStorage.getItem('session_key') },
          credentials: 'include'
        });
        const d = await res.json();

        // 🎯 FIX: Filter the bookings here in the frontend to ensure we ONLY show this user's data
        const userBookings = d.status === 'success'
          ? d.data.filter(b => b.client === userId)
          : [];

        const avatar = user.profile_pic ? 'http://localhost:8000' + user.profile_pic : `https://ui-avatars.com/api/?name=${encodeURIComponent(user.fullname)}&background=9f402d&color=fff`;

        let ordersHTML = '';
        if (userBookings.length > 0) {
          ordersHTML = userBookings.map(b => `
            <div class="flex items-center justify-between p-4 rounded-2xl bg-[#faf7f2] border border-[#ddc0ba]/20">
              <div class="flex flex-col">
                <span class="text-[10px] font-black text-[#89726d] uppercase tracking-tighter">Service Request</span>
                <span class="font-bold text-[#1c1c18]">${b.service_desc}</span>
                <span class="text-[10px] text-[#9f402d] font-bold">Worker: ${b.worker_name}</span>
              </div>
              <div class="text-right">
                <span class="block text-xs font-bold text-[#1c1c18]">${new Date(b.created_at).toLocaleDateString('en-IN')}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-white border border-[#ddc0ba]/30">${b.status}</span>
              </div>
            </div>
          `).join('');
        } else {
          ordersHTML = '<div class="text-center py-10 text-[#89726d] italic bg-[#faf7f2] rounded-2xl">No orders found for this user yet.</div>';
        }

        content.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
        <div class="md:col-span-4 space-y-6">
          <div class="text-center p-6 rounded-[2rem] bg-gradient-to-b from-[#faf7f2] to-white border border-[#ddc0ba]/20">
            <img src="${avatar}" class="w-24 h-24 rounded-full mx-auto border-4 border-white shadow-md mb-4">
            <h4 class="text-xl font-black text-[#1c1c18]">${user.fullname}</h4>
            <p class="text-[10px] font-black text-[#9f402d] uppercase tracking-widest">Verified Client</p>
          </div>
          
          <div class="space-y-3 px-2">
            <div class="flex flex-col">
              <span class="text-[10px] font-black text-[#89726d] uppercase">Email Address</span>
              <span class="text-sm font-semibold">${user.email}</span>
            </div>
            <div class="flex flex-col">
              <span class="text-[10px] font-black text-[#89726d] uppercase">Member Since</span>
              <span class="text-sm font-semibold">${new Date(user.date_joined).toLocaleDateString('en-IN')}</span>
            </div>
             <div class="flex flex-col">
              <span class="text-[10px] font-black text-[#89726d] uppercase">Contact Number</span>
              <span class="text-sm font-semibold">
                ${user.phone || 'Not provided'}
              </span>
            </div>
             <div class="flex flex-col">
              <span class="text-[10px] font-black text-[#89726d] uppercase">Total Expenditure</span>
              <span class="text-sm font-black text-green-600">Calculated on Checkout</span>
            </div>
          </div>
        </div>

        <div class="md:col-span-8">
          <h5 class="text-xs font-black uppercase text-[#89726d] mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">history</span> Booking & Order History
          </h5>
          <div class="space-y-3 max-h-[450px] overflow-y-auto pr-2 custom-scrollbar">
            ${ordersHTML}
          </div>
        </div>
      </div>
    `;
      } catch (e) {
        content.innerHTML = '<div class="text-center py-20 text-red-500">Error fetching user details. Please try again.</div>';
      }
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    loadVerifiedUsers();
  </script>
</body>

</html>
